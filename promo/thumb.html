<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Promo thumbnail</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { width:1920px; height:1080px; overflow:hidden; background:#0b0f0c; color:#eef1e6; font-family:'Manrope',sans-serif; position:relative; }
.shot { position:absolute; left:560px; top:-70px; width:1100px; border-radius:22px; border:2px solid #3a4638; transform:perspective(2200px) rotateY(-20deg) rotateX(6deg) rotateZ(1deg); filter:brightness(.5) saturate(.9); }
.portrait { position:absolute; right:0; top:0; width:860px; height:1080px; object-fit:cover; object-position:50% 12%; -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 26%); mask-image:linear-gradient(90deg,transparent 0,#000 26%); }
.blend { position:absolute; inset:0; background:linear-gradient(90deg,#0b0f0c 0,#0b0f0c 36%,rgba(11,15,12,.86) 50%,rgba(11,15,12,0) 70%),linear-gradient(0deg,rgba(11,15,12,.85),transparent 30%); }
.glow { position:absolute; left:-420px; top:-380px; width:1500px; height:1500px; border-radius:50%; background:radial-gradient(circle,rgba(198,242,122,.2),transparent 62%); }
.copy { position:absolute; left:96px; top:150px; }
.eyebrow { font-family:'JetBrains Mono',monospace; font-size:34px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:#c6f27a; }
.eyebrow i { display:inline-block; width:20px; height:20px; border-radius:50%; background:#c6f27a; margin-right:20px; }
h1 { margin-top:44px; font-size:236px; font-weight:800; letter-spacing:-.065em; line-height:.9; }
h1 span { color:#c6f27a; display:block; }
.sub { margin-top:56px; font-size:62px; font-weight:700; letter-spacing:-.04em; }
.pill { position:absolute; left:96px; bottom:84px; display:flex; gap:18px; }
.pill b { font-family:'JetBrains Mono',monospace; font-size:28px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; padding:20px 30px; border-radius:99px; border:2px solid #56634f; background:#0b0f0ce6; }
.pill b.on { background:#c6f27a; border-color:#c6f27a; color:#0c1408; }
.name { position:absolute; right:70px; bottom:84px; text-align:right; font-size:46px; font-weight:800; letter-spacing:-.04em; text-shadow:0 2px 24px #000; }
.name small { display:block; margin-top:8px; font-family:'JetBrains Mono',monospace; font-size:22px; font-weight:500; letter-spacing:.12em; color:#c6f27a; }
.bar { position:absolute; left:0; bottom:0; width:100%; height:14px; background:#c6f27a; }
</style>
</head>
<body>
<img class="shot" src="../services-assets/media/services/portfolio/mw5-mechbay.webp" alt="">
<img class="portrait" src="../remi-portrait.png" alt="">
<div class="blend"></div><div class="glow"></div>
<div class="copy">
  <p class="eyebrow"><i></i>UX/UI director · technical UI</p>
  <h1>Let’s<span>build it.</span></h1>
  <p class="sub">20 years of game UI, for hire.</p>
</div>
<div class="pill"><b class="on">Games</b><b>Apps</b><b>Sites</b><b>Training</b></div>
<div class="name">Remi Couture ✳<small>DESIGN → CODE</small></div>
<div class="bar"></div>
</body>
</html>
