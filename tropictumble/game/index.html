<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4aa8f0">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<title>Tropic Tumble</title>
<style>
  @font-face { font-family: Fredoka; font-weight: 700; src: url(fredoka-700.woff2) format('woff2'); font-display: swap; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #dfeefb; font-family: system-ui, sans-serif;
    user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
  #app { height: 100dvh; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; background: #f7dfae url(background.webp) center / cover no-repeat; position: relative; }

  #hud { display: flex; align-items: flex-start; justify-content: space-between; padding: 8px 10px 4px; position: relative; min-height: 88px; z-index: 6; }
  /* Hanging sign: ropes run off the top edge, page name sits on the plaque. */
  #sign { position: absolute; left: 50%; top: 0; width: 46%; aspect-ratio: 1085 / 425; transform: translateX(-50%);
    background: url(sign.png) center / 100% 100% no-repeat; pointer-events: none; }
  /* Gem and energy bars: art is one image each; the number, timer and + button are laid over its slots in %. */
  #stats { width: 26.5%; display: flex; flex-direction: column; gap: 2px; }
  .bar { position: relative; container-type: inline-size; background: center / 100% 100% no-repeat; font-weight: 800; }
  .bar span { position: absolute; display: flex; align-items: center; justify-content: center; white-space: nowrap; }
  .bar button { position: absolute; border: 0; padding: 0; background: none; border-radius: 50%; }
  .bar button:active { background: #ffffff66; }
  #gemsBar { aspect-ratio: 658 / 222; background-image: url(gems.png); color: #1d4f7a; }
  #gems { left: 31.2%; width: 44.8%; top: 18%; height: 63%; font-size: 15cqw; }
  #gemsBar button { left: 76.5%; width: 19%; top: 20%; height: 58%; }
  #energyBar { aspect-ratio: 648 / 312; background-image: url(energy.png); color: #8a4b00; }
  #energy { left: 31.6%; width: 44%; top: 22.4%; height: 32%; font-size: 15cqw; }
  #regen { left: 42.4%; width: 36.3%; top: 73%; height: 18.3%; font-size: 9.5cqw; }
  #energyBar button { left: 75.5%; width: 19%; top: 20%; height: 40%; }
  #gear { width: 40px; height: 40px; border: 0; border-radius: 12px; padding: 5px; background: linear-gradient(#5cc6ff, #1e8ff0);
    box-shadow: inset 0 2px 1px #ffffff99, inset 0 -3px 1px #0b6dd0, 0 2px 4px #0005; }
  #gear svg { display: block; width: 100%; height: 100%; filter: drop-shadow(0 1.5px 0 #0b6dd088); pointer-events: none; }
  .pill { background: #ffffffd9; border-radius: 999px; padding: 4px 10px; font-weight: 700; color: #1d4f7a; font-size: 14px; }
  #pageName { position: absolute; left: 0; right: 0; top: 58%; transform: translateY(-50%); text-align: center; font-weight: 800; color: #6b3a12;
    font-size: 15px; text-shadow: 0 1px 0 #ffffff80; }

  /* Settings menu, 9-sliced. In menu-panel.webp (1448x1086) the inner corner curves end 260px in from the sides and
     420/400px from top/bottom, so the slices sit past them: corners never stretch, only the flat edges and centre do.
     Drawn at 0.15 scale. The slices include the image's transparent margin, so rows are pulled back out over the cream. */
  #cheats { display: none; position: absolute; top: 26px; left: 2px; width: 66%; z-index: 20; flex-direction: column; gap: 4px;
    border-style: solid; border-width: 63px 39px 60px; border-image: url(menu-panel.webp) 420 260 400 260 fill / 63px 39px 60px stretch;
    filter: drop-shadow(0 6px 10px #0005); }
  #cheats.open { display: flex; }
  #cheats button { width: calc(100% + 34px); margin: 0 -17px; aspect-ratio: 5.06; border: 0; padding: 0 17% 0 9%;
    background: url(menu-row.webp) center / 114.8% auto no-repeat;
    font: 700 15px/1 Fredoka, system-ui, sans-serif; color: #2a66a8; text-align: left; white-space: nowrap; }
  #cheats button:first-child { margin-top: -21px; }
  #cheats button:last-child { margin-bottom: -18px; }
  #cheats button:active { background-image: url(menu-row-blue.webp); color: #fff; }

  /* The pile: every sticker is a loose body that falls and stacks. */
  #pile { flex: 1; position: relative; min-height: 0; clip-path: inset(-400px 0 -40px 0); }  /* no clipping at the floor line or the top; only the side walls clip */
  .st { position: absolute; left: 0; top: 0; width: var(--d); height: var(--d); margin: calc(var(--d) / -2) 0 0 calc(var(--d) / -2);
    font-size: calc(var(--d) * .8); line-height: var(--d); text-align: center; pointer-events: none; will-change: transform; }
  .st.t0 { filter: grayscale(1) contrast(.55) brightness(1.45) drop-shadow(0 0 1px #000) drop-shadow(0 0 1px #000); }
  .st.t1 { filter: brightness(0); }
  .st.t2 { filter: drop-shadow(0 2px 2px #0006); }
  .st.held { z-index: 10; }
  .st > span { display: block; width: 100%; height: 100%; background: center / contain no-repeat; }
  .st.pop > span { animation: pop .35s ease-out; }
  .st.held > span { transform: scale(1.2); }
  @keyframes pop { 0% { transform: scale(1.8); } }
  .fly { position: fixed; z-index: 30; pointer-events: none; transform: translate(-50%, -50%); background: center / contain no-repeat; }

  /* Pack panel: the art is one image; buttons, counters and the progress bar are laid over its slots in %. */
  #tray { position: relative; flex: none; margin: 12px 8px calc(8px + env(safe-area-inset-bottom));  /* the pile's floor sits a gap above the fox's ears, so no sticker goes behind the panel */
    aspect-ratio: 2000 / 935; background: url(panel.webp) center / 100% 100% no-repeat;
    container-type: inline-size; z-index: 5; }
  .pack { position: absolute; top: 51.8%; height: 41.5%; width: 21.65%; border: 0; padding: 0; background: none; border-radius: 22% / 24%; }
  .pack span.e { position: absolute; left: 8%; right: 8%; top: 3%; height: 72%; background: center / contain no-repeat; }
  .pack span.n { position: absolute; left: 0; right: 0; top: 75%; height: 20%; display: flex; align-items: center; justify-content: center;
    font-size: 3.4cqw; font-weight: 800; color: #3b3350; }
  .pack:active { transform: scale(.94); }
  .pack.bump { animation: bump .3s ease-out; }
  .pack.done span.e { opacity: .35; }
  .pack.done span.n { top: 60%; height: 38%; }
  .pack.done span.n svg { height: 100%; filter: drop-shadow(0 1px 1px #0004); }
  .pack.done.bump span.n svg { animation: checkIn .4s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes checkIn { 0% { transform: scale(0) rotate(-40deg); } }
  #bar { position: absolute; left: 33.35%; top: 36.9%; width: 36.65%; height: 9.1%; border-radius: 99px; overflow: hidden; }
  #bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(#ffe45c, #ffb300); transition: width .3s; }
  #total { position: absolute; left: 72.6%; top: 36.9%; width: 10.8%; height: 9.1%; display: flex; align-items: center; justify-content: center;
    font-size: 3.2cqw; font-weight: 800; color: #fff; }
  @keyframes bump { 0% { transform: scale(1.15); } }

  #toast { position: absolute; left: 50%; top: 42%; z-index: 60; transform: translateX(-50%); background: #1d4f7aee; color: #fff; padding: 8px 14px;
    border-radius: 999px; font-size: 14px; font-weight: 600; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 25; white-space: nowrap; }
  #toast.show { opacity: 1; }
  /* Art toast: the message is drawn in the image, so the text is hidden. */
  #toast.art { width: 90%; aspect-ratio: 1000 / 334; padding: 0; border-radius: 0; color: transparent;
    background: center / contain no-repeat; }
  /* Level-complete screen. Each image has transparent padding, so background-size zooms to its artwork. */
  #win { display: none; position: absolute; inset: 0; z-index: 40; background: #0b2a4a70; backdrop-filter: blur(3px);
    align-items: center; justify-content: center; }
  #win.open { display: flex; }
  #winBox { position: relative; width: 84%; animation: winIn .45s cubic-bezier(.2, 1.5, .4, 1); }
  #winBox .sparkles { position: absolute; left: 19%; bottom: calc(100% - 14px); width: 62%; aspect-ratio: 1; pointer-events: none;
    background: url(win-sparkles.webp) center / contain no-repeat; animation: twinkle 1.6s ease-in-out infinite alternate; }
  #winCard { position: relative; container-type: inline-size; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 46px 10px 18px;
    background: #fdf3e3; border: 6px solid #8fd2fb; border-radius: 30px;
    box-shadow: 0 0 0 3px #3aa2ea, inset 0 0 0 3px #ffffff, 0 12px 30px #0007; }
  #winCard .popper { position: absolute; top: -50px; left: 0; right: 0; text-align: center; font-size: 72px; line-height: 1; }
  /* Title and button are drawn as text (the supplied art has "Page" baked in). */
  #winCard .title { position: relative; z-index: 0; font: 700 12.6cqw/1.25 Fredoka, system-ui, sans-serif; white-space: nowrap; transform: rotate(-2deg); }
  #winCard .title::before { content: attr(data-t); position: absolute; inset: 0; z-index: -1; color: #b5430b;
    -webkit-text-stroke: 2.6cqw #b5430b; filter: drop-shadow(0 .6cqw 0 #7a2c05); }
  #winCard .title span { background: linear-gradient(#fff48a 25%, #ffcf26 55%, #ff9d1a 85%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #winCard .rewards { width: 88%; aspect-ratio: 4.02; background: url(win-pill.webp) center / 110% auto no-repeat;
    display: flex; align-items: center; justify-content: space-evenly; padding: 0 4%; }
  #winCard .rewards i { width: 39%; aspect-ratio: 2.2; background: center / 130% auto no-repeat; }
  #next { width: 80%; padding: 3.6cqw 0; border: .9cqw solid #0e8f22; border-radius: 999px; background: linear-gradient(#8cf54e, #33cf33 60%, #25b82c);
    box-shadow: inset 0 1cqw 0 #c4ff9c, inset 0 -1.6cqw 0 #1c9f28, 0 1.4cqw 2cqw #0005;
    font: 700 8.2cqw/1 Fredoka, system-ui, sans-serif; color: #fff; -webkit-text-stroke: 1.8cqw #0e8f22; paint-order: stroke fill; }
  #next:active { transform: scale(.95); }
  @keyframes winIn { 0% { transform: scale(.4); opacity: 0; } }
  @keyframes twinkle { 0% { opacity: .55; transform: scale(.94) rotate(-3deg); } 100% { opacity: 1; transform: scale(1.04) rotate(3deg); } }

  /* ---- Game systems: tools, score, danger line, ice, tutorial, modals ---- */
  #tools { position: absolute; left: 8px; top: 58px; z-index: 7; display: flex; flex-direction: column; gap: 7px; }
  #tools button { position: relative; width: 42px; height: 42px; border-radius: 50%; border: 2.5px solid var(--b); padding: 8px;
    background: linear-gradient(var(--a), var(--c)); box-shadow: inset 0 2px 1px #ffffff99, inset 0 -3px 1px #0002, 0 2px 4px #0005; transition: transform .1s; }
  #tools button:active { transform: scale(.86); }
  #tools svg { display: block; width: 100%; height: 100%; fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round;
    filter: drop-shadow(0 1px 0 #0004); pointer-events: none; }
  #tools em { position: absolute; right: -5px; bottom: -4px; min-width: 19px; height: 19px; padding: 0 4px; border-radius: 99px; background: #fff; color: #16324f;
    font: 700 12px/19px Fredoka, system-ui, sans-serif; box-shadow: 0 1px 2px #0005; pointer-events: none; }
  #tools em.cost { background: #2a9bf4; color: #fff; }
  #score { position: absolute; left: 0; right: 0; top: 97%; text-align: center; font: 700 15px/1 Fredoka, system-ui, sans-serif; color: #fff;
    -webkit-text-stroke: 4px #8a4a1c; paint-order: stroke fill; }

  /* Danger line: the pile must not settle above it. --danger (0..1) is how close the level is to being lost. */
  #dangerLine { display: none; position: absolute; left: 0; right: 0; top: calc(var(--d) * 1.1); height: 0; border-top: 3px dashed #ffffffb0; pointer-events: none; z-index: 2; }
  #pile.tide #dangerLine { display: block; }
  #dangerLine::before { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--d) * 1.1 + 110px);
    background: linear-gradient(#ff2d55b0, transparent); opacity: var(--danger, 0); }
  #pile.danger #dangerLine { border-color: #ff2d55; animation: dangerPulse .45s ease-in-out infinite alternate; }
  @keyframes dangerPulse { 100% { filter: brightness(1.6); } }

  /* Ice: a frozen sticker cannot be moved or matched until a match is made next to it. */
  .st.ice::after { content: ''; position: absolute; inset: -5%; border-radius: 30%; z-index: 1; border: 2px solid #ffffffe0;
    background: linear-gradient(135deg, #ffffffc8 0 14%, #c9eeff8c 28% 55%, #9fdcff88 82%, #ffffffb0); box-shadow: inset 0 0 10px #fff, 0 2px 4px #0003; }
  .st.hinted { z-index: 9; }
  .st.hinted::after { content: ''; position: absolute; inset: -6%; border-radius: 50%; border: 4px solid #fff; box-shadow: 0 0 14px 4px #ffe45c;
    animation: hintPulse .5s ease-in-out infinite alternate; }
  @keyframes hintPulse { 100% { transform: scale(1.18); opacity: .6; } }

  #hand { position: fixed; z-index: 50; width: 56px; height: 56px; margin: -4px 0 0 -22px; opacity: 0; pointer-events: none; filter: drop-shadow(0 4px 4px #0005); }
  #toast.art.blank { display: grid; place-items: center; padding: 14% 17% 1% 21%; color: #fff; white-space: nowrap;
    font: 700 min(5.6vw, 27px)/1 Fredoka, system-ui, sans-serif; -webkit-text-stroke: 5px #0b3a6e; paint-order: stroke fill; }
  /* A tutorial tip on the blank fox banner: the message is live text on the bar, up to two lines. */
  #tip.art.blank { display: grid; place-items: center; padding: 13.5% 15% 0.5% 19%; color: #fff; font: 700 min(4.3vw, 20px)/1.05 Fredoka, system-ui, sans-serif;
    -webkit-text-stroke: 4px #0b3a6e; paint-order: stroke fill; }
  /* The gift banner's empty bar sits further right and lower-middle; longer messages wrap onto two lines. */
  #toast.art.blank.gift { padding: 0 14% 2% 33%; white-space: normal; text-align: center; font-size: min(4.9vw, 23px); line-height: 1.05; }
  #tip { position: absolute; left: 57%; top: 108px; width: max-content; max-width: 68%; text-align: center; transform: translateX(-50%) scale(.8); z-index: 8; opacity: 0; pointer-events: none;
    padding: 9px 16px; border-radius: 99px; background: linear-gradient(#6fd0ff, #2a9bf4); border: 3px solid #fff; box-shadow: 0 4px 10px #0004;
    font: 700 15px/1.25 Fredoka, system-ui, sans-serif; color: #fff; transition: opacity .25s, transform .25s; }
  #tip.on { opacity: 1; transform: translateX(-50%) scale(1); }
  /* Art tip: the message is drawn in the image, so the text is hidden. */
  #tip.art { left: 56%; top: 92px; width: 80%; max-width: none; aspect-ratio: 1000 / 334; padding: 0; border: 0; border-radius: 0; box-shadow: none; color: transparent;
    background: center / contain no-repeat; }

  #modal { display: none; position: absolute; inset: 0; z-index: 45; background: #0b2a4a70; backdrop-filter: blur(3px); align-items: center; justify-content: center; }
  #modal.open { display: flex; }
  #mcard { width: 88%; max-height: 94%; overflow: auto; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 22px 14px 18px; text-align: center;
    background: #fdf3e3; border: 6px solid #8fd2fb; border-radius: 30px; box-shadow: 0 0 0 3px #3aa2ea, inset 0 0 0 3px #fff, 0 12px 30px #0007;
    animation: winIn .4s cubic-bezier(.2, 1.5, .4, 1); color: #16324f; font: 600 15px/1.4 system-ui, sans-serif; }
  #mcard, #mcard * { touch-action: pan-y; }
  #mcard p { margin: 0; }
  .mtitle { font: 700 30px/1.15 Fredoka, system-ui, sans-serif; color: #ffc21f; -webkit-text-stroke: 6px #b5430b; paint-order: stroke fill; }
  .mtitle.bad { color: #ff9aa9; -webkit-text-stroke-color: #b3123a; }
  .mreward { font: 700 19px/1 Fredoka, system-ui, sans-serif; color: #2a66a8; background: #dff1ff; border: 2px solid #9fd3fb; border-radius: 99px; padding: 10px 18px; }
  #mcard button { min-width: 72%; padding: 13px 18px; border-radius: 999px; border: 3px solid #0e8f22; background: linear-gradient(#8cf54e, #33cf33 60%, #25b82c);
    box-shadow: inset 0 3px 0 #c4ff9c, inset 0 -5px 0 #1c9f28, 0 4px 6px #0004; font: 700 18px/1 Fredoka, system-ui, sans-serif; color: #fff;
    -webkit-text-stroke: 4px #0e8f22; paint-order: stroke fill; }
  #mcard button.alt { border-color: #0b62c4; background: linear-gradient(#6fd0ff, #2a9bf4 60%, #1c84e0); box-shadow: inset 0 3px 0 #c9efff, inset 0 -5px 0 #1470c9, 0 4px 6px #0004;
    -webkit-text-stroke-color: #0b62c4; }
  #mcard button:active { transform: scale(.95); }
  .album { width: 100%; display: grid; gap: 10px; }
  .apage { background: #fff; border: 2px solid #bfe3fb; border-radius: 18px; padding: 10px; }
  .ahead { display: flex; justify-content: space-between; align-items: center; gap: 8px; font: 700 16px/1 Fredoka, system-ui, sans-serif; color: #0b3a6e; margin-bottom: 8px; }
  .ahead i { font: 600 12px/1 system-ui, sans-serif; color: #5b7c99; }
  #mcard .ahead button { min-width: 0; padding: 7px 12px; font-size: 13px; -webkit-text-stroke-width: 3px; }
  .arow { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .astk span { display: block; aspect-ratio: 1; background: center / contain no-repeat; }
  .astk.none span { filter: grayscale(1) brightness(1.3); opacity: .35; }
  .astk em { display: block; font: 700 11px/1.4 Fredoka, system-ui, sans-serif; color: #2a66a8; }
  /* Thick ice takes two neighbouring matches to melt. */
  .st.ice.thick::after { border: 4px solid #fff; background: linear-gradient(135deg, #ffffffe6 0 16%, #b9e6ffd8 28% 55%, #7fcfffd0 82%, #ffffffe0);
    box-shadow: inset 0 0 0 3px #9fdcff, inset 0 0 12px #fff, 0 2px 4px #0003; }

  /* Level select */
  #sign { pointer-events: auto; cursor: pointer; }
  #pageName::after { content: ' ▾'; font-size: .7em; }
  .levels { width: 100%; max-height: 46vh; overflow: auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; padding: 5px; }
  #mcard .lv { min-width: 0; padding: 9px 0 7px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 20px; }
  .lv span { display: flex; gap: 1px; }
  .lv i { display: block; width: 13px; }
  .lv i svg { display: block; fill: #ffffff66; stroke: none; }
  .lv i.on svg { fill: #ffe45c; }
  #mcard .lv.cur { outline: 3px solid #ffb300; outline-offset: 2px; }
  #mcard .lv.locked { background: #cfd8e3; border-color: #aab6c5; box-shadow: none; opacity: .7; }

  /* Pretend ads */
  #ad { display: none; position: absolute; inset: 0; z-index: 70; background: #0b1a2ef5; align-items: center; justify-content: center; color: #fff; text-align: center; }
  #ad.open { display: flex; }
  #adBox { width: 82%; display: flex; flex-direction: column; align-items: center; gap: 16px; font: 600 15px/1.4 system-ui, sans-serif; }
  #adBox p { margin: 0; opacity: .8; }
  .adTag { font: 700 13px/1 Fredoka, system-ui, sans-serif; letter-spacing: .1em; background: #ffe45c; color: #16324f; border-radius: 6px; padding: 5px 10px; }
  .adBig { font: 700 28px/1.15 Fredoka, system-ui, sans-serif; }
  .adRing { position: relative; width: 92px; height: 92px; display: grid; place-items: center; font: 700 40px/1 Fredoka, system-ui, sans-serif; }
  .adRing::before { content: ''; position: absolute; inset: 0; border-radius: 50%; border: 6px solid #ffffff30; border-top-color: #ffe45c; animation: spin 1s linear infinite; }
  #adBox button { padding: 10px 24px; border-radius: 99px; border: 2px solid #fff; background: transparent; color: #fff; font: 700 16px/1 Fredoka, system-ui, sans-serif; }
  #winAd { width: 80%; padding: 3cqw 0; border: .7cqw solid #0b62c4; border-radius: 999px; background: linear-gradient(#6fd0ff, #2a9bf4 60%, #1c84e0);
    box-shadow: inset 0 .8cqw 0 #c9efff, inset 0 -1.2cqw 0 #1470c9, 0 1cqw 1.6cqw #0004; font: 700 5.4cqw/1 Fredoka, system-ui, sans-serif; color: #fff;
    -webkit-text-stroke: 1.3cqw #0b62c4; paint-order: stroke fill; }
  #winAd[hidden] { display: none; }
  @keyframes spin { 100% { transform: rotate(360deg); } }

  /* Shop */
  .testmode { font: 700 12px/1.3 system-ui, sans-serif; color: #8a4b00; background: #ffe9a8; border: 2px dashed #e8a200; border-radius: 10px; padding: 6px 10px; }
  .balance { display: flex; align-items: center; gap: 6px; font: 700 22px/1 Fredoka, system-ui, sans-serif; color: #0b3a6e; }
  .gem { display: block; width: 30px; height: auto; }
  .offer { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; text-align: left; padding: 12px; border-radius: 18px;
    background: linear-gradient(#fff6c9, #ffe07a); border: 3px solid #ffb300; box-shadow: 0 4px 0 #e89a00; }
  .offer.plain { background: #fff; border-color: #bfe3fb; box-shadow: 0 4px 0 #bfe3fb; }
  .offer b { display: block; font: 700 18px/1.1 Fredoka, system-ui, sans-serif; color: #0b3a6e; }
  .offer small { display: block; font: 600 12px/1.3 system-ui, sans-serif; color: #4b6580; margin-top: 3px; }
  .packs { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 12px 10px; margin-top: 4px; }
  .pk { position: relative; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 12px 8px 9px; background: #fff; border: 2px solid #bfe3fb; border-radius: 18px; }
  .pk b { font: 700 16px/1 Fredoka, system-ui, sans-serif; color: #0b3a6e; }
  .pk em { position: absolute; top: -9px; left: 50%; transform: translateX(-50%); white-space: nowrap; font: 700 11px/1 Fredoka, system-ui, sans-serif; color: #fff;
    background: #ff4f8b; border-radius: 99px; padding: 4px 8px; }
  .pk .gems { height: 44px; display: grid; place-items: center; }
  .g0 .gem { width: 34px; } .g1 .gem { width: 42px; } .g2 .gem { width: 50px; } .g3 .gem { width: 58px; }

<script>
// ---- Tuning ----
const PACKS = [
  { name: 'Foods',   icon: 'pack-foods.webp',   e: ['icecream', 'cupcake', 'donut', 'pizza', 'hotdog'] },
  { name: 'Animals', icon: 'pack-animals.webp', e: ['fox', 'bee', 'fish', 'crab'] },
  { name: 'Kitchen', icon: 'pack-kitchen.webp', e: ['pan', 'pancakes', 'cheese', 'pretzel'] },
  { name: 'Beach',   icon: 'pack-beach.webp',   e: ['watermelon', 'coconut', 'shell', 'palm'] },
];
// Every sticker is full colour (tier 2): two identical ones match and fly to their pack.
// These five dials are set per level by applyLevel().
let TARGET = 12;                     // matches to collect per pack
let START_PAIRS = 24;                // pairs in the starting pile
let KINDS = 5;                       // sticker designs per pack in play
let TIDE_S = 0;                      // seconds between new pairs dropping in (0 = no tide)
let ICE_N = 0;                       // frozen stickers in the starting pile
let THICK_N = 0;                     // of those, how many are double-frozen
// Level curve: each level turns the dials a little further.
function levelCfg(n) {
  // Levels 1-9 introduce things one at a time. From 10 on the pile grows, the tide quickens and thick ice appears,
  // so the climb never flattens out (it tops out around level 21).
  return {
    kinds: n < 3 ? 3 : n < 5 ? 4 : 5,
    target: Math.min(12, 4 + 2 * n),
    pairs: n < 10 ? Math.min(18, 10 + 2 * n) : Math.min(22, 18 + Math.floor((n - 9) / 2)),
    tide: n < 2 ? 0 : n <= 9 ? 6.5 - 0.5 * n : Math.max(1.4, 2 - (n - 9) * 0.05),
    ice: n < 3 ? 0 : n <= 6 ? (n - 2) * 2 : Math.min(14, 8 + Math.floor((n - 6) / 2)),
    thick: n < 10 ? 0 : Math.min(6, n - 9),
  };
}
function applyLevel() { const L = levelCfg(state.page); KINDS = L.kinds; TARGET = L.target; START_PAIRS = L.pairs; TIDE_S = L.tide; ICE_N = L.ice; THICK_N = L.thick; }
const kindsOf = (c) => Math.min(PACKS[c].e.length, KINDS);
const ALBUM_GOAL = 10, ALBUM_REWARD = 50, BOOST_COST = 40, CONTINUE_COST = 60, RETRY_COST = 5, DANGER_S = 3.5;
const WIN_GEMS = 50, WIN_ENERGY = 20, REPLAY_GEMS = 10, AD_ENERGY = 25;
const MAX_ENERGY = 100, REGEN_MS = 20000;
const GRAVITY = 0.45, DAMPING = 0.985, ITERATIONS = 6, OVERLAP = 0.94;
const art = (b) => `url(st-${PACKS[b.c].e[b.k]}.webp)`;
// Finished-pack badge: glossy green button with a white tick, drawn to match the supplied checkmark art.
const CHECK = '<svg viewBox="0 0 100 100"><defs><radialGradient id="ckg" cx="35%" cy="25%" r="80%"><stop offset="0" stop-color="#9dff4a"/>'
  + '<stop offset=".55" stop-color="#3fd83a"/><stop offset="1" stop-color="#1fb648"/></radialGradient></defs>'
  + '<circle cx="50" cy="50" r="46" fill="url(#ckg)" stroke="#149a3c" stroke-width="4"/>'
  + '<ellipse cx="33" cy="24" rx="16" ry="6" fill="#fff" opacity=".55" transform="rotate(-28 33 24)"/>'
  + '<path d="M30 53 L45 68 L72 38" fill="none" stroke="#0f9a35" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>'
  + '<path d="M30 53 L45 68 L72 38" fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const PACK_LEFT = [4.75, 27.65, 50.5, 73.4];   // left edge of each card slot in panel.webp, in %
const SAVE_KEY = 'stickermerge.v3';

// ---- State ----
const $ = (id) => document.getElementById(id);
const pile = $('pile');
let W = 0, H = 0, R = 26, nextId = 1;
const els = new Map();               // body id -> DOM element
const fresh = () => ({ page: 1, gems: 0, energy: MAX_ENERGY, energyTs: Date.now(), counts: PACKS.map(() => 0), bodies: null,
  score: 0, stars: {}, album: PACKS.map((p) => p.e.map(() => 0)), albumClaimed: PACKS.map(() => false),
  boosters: { hint: 3, shuffle: 3, magnet: 3 }, tut: 0, daily: { last: '', streak: 0 }, sound: true, music: true, noAds: false, purchases: {}, starterShown: false, maxPage: 1 });
let state = load();
applyLevel();
let bodies = [];

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (s && Array.isArray(s.counts) && s.counts.length === PACKS.length) { const st = Object.assign(fresh(), s); st.maxPage = Math.max(st.maxPage, st.page); return st; }   // older saves gain the new fields
  } catch {}
  return fresh();
}
function save() {
  state.bodies = bodies.map(({ c, k, t, x, y, rot, ice }) => ({ c, k, t, x: Math.round(x), y: Math.round(y), rot: Math.round(rot), ice: ice | 0 }));
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch {}
}

const sameKind = (a, b) => a.c === b.c && a.k === b.k && a.t === b.t;
const packDone = (c) => state.counts[c] >= TARGET;
const capacity = () => Math.floor(W * H * 0.62 / (Math.PI * R * R));

function measure() {
  W = pile.clientWidth; H = pile.clientHeight;
  R = Math.max(20, Math.min(W / 13.5, 34));
  pile.style.setProperty('--d', 2 * R + 'px');
  layoutBg();
}

// ---- Bodies ----
function addBody(c, k, t, x, y, rot, ice) {
  const b = { id: nextId++, c, k, t, x, y, px: x, py: y, rot: rot ?? (Math.random() - 0.5) * 60, ice: ice | 0 };
  const el = document.createElement('div');
  el.innerHTML = `<span style="background-image:${art(b)}"></span>`;
  pile.appendChild(el); els.set(b.id, el);
  bodies.push(b); setTier(b);
  return b;
}
function setTier(b, pop) { els.get(b.id).className = 'st t' + b.t + (b.ice ? ' ice' + (b.ice > 1 ? ' thick' : '') : '') + (pop ? ' pop' : ''); }
function removeBody(b) { els.get(b.id)?.remove(); els.delete(b.id); bodies = bodies.filter((o) => o !== b); }
function clearBodies() { bodies.forEach((b) => els.get(b.id)?.remove()); els.clear(); bodies = []; }
// New stickers drop in from above the top edge.
function dropIn(c, k, t, delay = 0) { return addBody(c, k, t, R + Math.random() * (W - 2 * R), -R - delay * R * 2.2 - Math.random() * R); }
function randomTier() { return 2; }

// Top the pile back up to full: a twin for any lone sticker first, then fresh pairs from the packs still being
// collected. Everything it drops can be matched, so there is always a move.
function fillPile() {
  const open = PACKS.map((_, c) => c).filter((c) => !packDone(c));
  if (!open.length) return;
  let delay = 0;
  for (const b of [...bodies]) {
    if (bodies.filter((o) => sameKind(o, b)).length % 2) dropIn(b.c, b.k, b.t, delay += 0.25);
  }
  for (let i = 0; bodies.length < START_PAIRS * 2; i++) {
    const c = open[i % open.length], k = Math.floor(Math.random() * kindsOf(c)), t = randomTier();
    dropIn(c, k, t, delay += 0.25); dropIn(c, k, t, delay += 0.25);
  }
}
function seedPile() { clearBodies(); fillPile(); }
const hasMove = () => bodies.some((a) => !a.ice && bodies.some((b) => a !== b && !b.ice && sameKind(a, b)));
function findPair() {
  for (const a of bodies) if (!a.ice) { const b = bodies.find((o) => o !== a && !o.ice && sameKind(o, a)); if (b) return [a, b]; }
  return null;
}
function thaw(o) {
  o.ice--; setTier(o, !o.ice);
  const pr = pile.getBoundingClientRect(); burst(pr.left + o.x, pr.top + o.y, 8); SND.thaw();
}
// No move left: top the pile up, and if everything that could match is frozen, melt it.
function refill() { fillPile(); if (!hasMove()) bodies.forEach((b) => { while (b.ice) thaw(b); }); }

// ---- Physics: circles, gravity, walls. Fixed 60 Hz step so it plays the same on any screen. ----
function step() {
  const held = drag?.b;
  for (const b of bodies) {
    if (b === held) continue;
    let vx = (b.x - b.px) * DAMPING, vy = (b.y - b.py) * DAMPING + GRAVITY;
    const max = R * 0.8, sp = Math.hypot(vx, vy);
    if (sp > max) { vx *= max / sp; vy *= max / sp; }
    b.px = b.x; b.py = b.y; b.x += vx; b.y += vy;
    if (Math.abs(vx) > 0.25) b.rot += vx * 1.2;
  }
  const min = 2 * R * OVERLAP;
  for (let it = 0; it < ITERATIONS; it++) {
    for (let i = 0; i < bodies.length; i++) {
      const a = bodies[i];
      if (a !== held) for (let j = i + 1; j < bodies.length; j++) {
        const b = bodies[j];
        if (b === held) continue;
        let dx = b.x - a.x;
        // Perfectly stacked circles balance forever; lean the upper one toward the middle so columns topple.
        if (Math.abs(dx) < 1) { const up = a.y < b.y ? a : b, s = up.x > W / 2 ? -1 : 1; dx = up === b ? s : -s; }
        const dy = b.y - a.y, d2 = dx * dx + dy * dy;
        if (d2 >= min * min) continue;
        const d = Math.sqrt(d2) || 0.01, push = (min - d) / 2, nx = dx / d, ny = dy / d;
        a.x -= nx * push; a.y -= ny * push; b.x += nx * push; b.y += ny * push;
      }
      if (a === held) continue;
      if (a.x < R) a.x = R; else if (a.x > W - R) a.x = W - R;
      if (a.y > H - R) { a.y = H - R; a.px = a.x - (a.x - a.px) * 0.7; }   // floor friction
    }
  }
}
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { step(); pressure(1 / 60); acc -= 1000 / 60; }
  for (const b of bodies) els.get(b.id).style.transform = `translate(${b.x}px, ${b.y}px) rotate(${b.rot}deg)`;
  requestAnimationFrame(frame);
}

// ---- Energy + HUD ----
function tickEnergy() {
  const now = Date.now();
  if (state.energy >= MAX_ENERGY) state.energyTs = now;
  else while (state.energy < MAX_ENERGY && now - state.energyTs >= REGEN_MS) { state.energy++; state.energyTs += REGEN_MS; }
  setNum('energy', state.energy);
  const left = Math.ceil((REGEN_MS - (now - state.energyTs)) / 1000);
  $('regen').textContent = state.energy >= MAX_ENERGY ? 'FULL' : Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
}
function renderHud(bump) {
  $('pageName').textContent = 'Level ' + state.page;

// ---- Actions ----
function spawn(c) {
  if (packDone(c)) return toast(PACKS[c].name + ' is finished', BLANK);
  if (bodies.length >= capacity()) return toast('Not enough space', 'toast-no-space.webp');
  if (state.energy < 1) return toast('Out of energy', 'toast-out-of-energy.webp');
  state.energy--;
  // Finish an unpaired sticker of this pack if there is one, so every drop can be matched.
  const odd = PACKS[c].e.map((_, k) => k).filter((k) => bodies.filter((b) => b.c === c && b.k === k).length % 2);
  const k = odd.length ? pick(odd) : Math.floor(Math.random() * kindsOf(c));
  const nb = dropIn(c, k, randomTier());
  if (!odd.length) dropIn(c, k, randomTier(), 0.4);   // a twin for a loner, otherwise a fresh pair
  SND.drop();
  burst(pile.getBoundingClientRect().left + nb.x, pile.getBoundingClientRect().top + 8, 4);
  tickEnergy(); save();
}

// Nearest identical sticker close enough to the held one to merge with.
function mergeTarget(a) {
  let best = null, bestD = R * 2.2;
  for (const b of bodies) {
    if (b === a || b.ice || !sameKind(a, b)) continue;
    const d = Math.hypot(b.x - a.x, b.y - a.y);
    if (d < bestD) { bestD = d; best = b; }
  }
  return best;
}

function merge(a, b) {
  navigator.vibrate?.(15);
  const pr = pile.getBoundingClientRect(), mx = pr.left + (a.x + b.x) / 2, my = pr.top + (a.y + b.y) / 2, c = a.c;
  // a match cracks any ice next to it
  for (const o of bodies) {
    if (o.ice && Math.min(Math.hypot(o.x - a.x, o.y - a.y), Math.hypot(o.x - b.x, o.y - b.y)) < R * 3.2) thaw(o);
  }
  flyToPack(a); flyToPack(b); removeBody(a); removeBody(b);
  state.counts[c]++; state.album[c][a.k] = (state.album[c][a.k] || 0) + 1; onMatch(c);
  const pts = 100 * Math.min(run.combo, 5);          // quick matches are worth up to five times as much
  state.score += pts; SND.pop(run.combo);
  burst(mx, my, 14); floatText(mx, my - R, '+' + pts);
  if (packDone(c)) bodies.filter((o) => o.c === c).forEach((o) => { flyToPack(o); removeBody(o); });
  if (state.tut === 0) { state.tut = 1; tutorial(); }
  renderHud(c); save();
  if (state.counts.every((n) => n >= TARGET)) { ending = true; return setTimeout(win, 600); }
  // Pile cleared (or nothing left that matches): a fresh wave tumbles in, free.
  if (!hasMove()) setTimeout(() => { if (!hasMove() && !ending) { refill(); toast('Fresh wave!', 'toast-fresh-wave.webp'); SND.wave(); save(); } }, 500);
}

function flyToPack(b) {
  const from = pile.getBoundingClientRect(), to = document.querySelector(`[data-pack="${b.c}"]`).getBoundingClientRect();
  const f = document.createElement('div');
  f.className = 'fly'; f.style.backgroundImage = art(b); f.style.width = f.style.height = R * 2 + 'px';
  const x0 = from.left + b.x, y0 = from.top + b.y, x1 = to.left + to.width / 2, y1 = to.top + to.height / 2;
  f.style.left = x0 + 'px'; f.style.top = y0 + 'px';
  document.body.appendChild(f);
  f.animate([{ left: x0 + 'px', top: y0 + 'px', opacity: 1, transform: 'translate(-50%, -50%) scale(1.3) rotate(0deg)' }, { left: x1 + 'px', top: y1 + 'px', opacity: 0.8, transform: 'translate(-50%, -50%) scale(.45) rotate(360deg)' }],
    { duration: 380, easing: 'ease-in' });
  setTimeout(() => { f.remove(); burst(x1, y1, 5); }, 380);
}

function win() {
  if ($('win').classList.contains('open')) return;
  // Stars come from the score against the level's par. Combos multiply matches up to five times, so strong play lands far above par.
  const par = PACKS.length * TARGET * 100, ratio = state.score / par, stars = ratio >= 5 ? 3 : ratio >= 3 ? 2 : 1;
  const before = state.stars[state.page] || 0, first = !before;
  // The full reward is for the first clear. A replay pays a small tip, plus a booster for each star it adds.
  const newStars = Math.max(0, stars - Math.max(before, 1)), keys = Object.keys(state.boosters);
  for (let i = 0; i < newStars; i++) state.boosters[pick(keys)]++;
  winGems = first ? WIN_GEMS : REPLAY_GEMS;
  state.gems += winGems; if (first) state.energy = Math.min(MAX_ENERGY, state.energy + WIN_ENERGY);
  state.stars[state.page] = Math.max(before, stars);
  if (state.page === state.maxPage) state.maxPage++;
  renderWin(stars, newStars, first);
  renderHud(); renderTools(); save(); $('win').classList.add('open'); confetti(); SND.win();
}

let drag = null;
function local(e) { const r = pile.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
pile.addEventListener('pointerdown', (e) => {
  if (drag) return;
  const p = local(e);
  let hit = null, hitD = R * 1.25;
  for (const b of bodies) { const d = Math.hypot(b.x - p.x, b.y - p.y); if (d < hitD) { hitD = d; hit = b; } }
  if (!hit) return;
  if (hit.ice) { fx(els.get(hit.id), 'shake'); SND.nope(); return toast('Frozen! Make a match next to it', 'toast-frozen.webp'); }
  e.preventDefault();
  try { pile.setPointerCapture(e.pointerId); } catch {}
  drag = { b: hit, id: e.pointerId, ox: hit.x - p.x, oy: hit.y - p.y, x0: hit.x, y0: hit.y };
  els.get(hit.id).classList.add('held');
});
pile.addEventListener('pointermove', (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  const p = local(e), b = drag.b;
  b.x = b.px = Math.max(R, Math.min(W - R, p.x + drag.ox));
  b.y = b.py = Math.max(R, Math.min(H - R, p.y + drag.oy));
});
function endDrag(e) {
  if (!drag || e.pointerId !== drag.id) return;
  // A match needs a real drag: a tap on a sticker that happens to touch its twin does nothing.
  const b = drag.b, dragged = Math.hypot(b.x - drag.x0, b.y - drag.y0) > R * 0.5;
  const t = e.type === 'pointerup' && dragged ? mergeTarget(b) : null;
  els.get(b.id)?.classList.remove('held');
  drag = null;
  try { pile.releasePointerCapture(e.pointerId); } catch {}
  if (t) return merge(b, t);
  // Dropped on a different sticker: a little "nope" wobble before it falls back into the pile.
  if (e.type === 'pointerup' && dragged && bodies.some((o) => o !== b && Math.hypot(o.x - b.x, o.y - b.y) < R * 1.5)) { fx(els.get(b.id), 'shake'); onMiss(); SND.nope(); }
  save();
}

  if (k === 'sound') { state.sound = !state.sound; renderSound(); SND.click(); }
  if (k === 'music') { state.music = !state.music; renderSound(); if (state.music) startMusic(); else stopMusic(); }
  renderHud(); save();
});

function renderSound() {
  $('soundRow').textContent = state.sound ? '🔊 Sound: on' : '🔇 Sound: off';
  $('musicRow').textContent = state.music ? '🎵 Music: on' : '🎵 Music: off';
}

// ---- Boot ----
renderHud();                         // tray first, so the pile is measured at its real height
measure();
new ResizeObserver(measure).observe(pile);
// Reopened on a finished level (closed before tapping Next): go straight back to the completed screen, rewards already paid.
const finished = state.counts.every((n) => n >= TARGET);
renderTools(); renderSound(); pile.classList.toggle('tide', TIDE_S > 0);
if (finished) { renderWin(state.stars[state.page] || 1, 0, true); $('win').classList.add('open'); }
else if (state.bodies?.length) { state.bodies.filter((b) => PACKS[b.c]?.e[b.k]).forEach((b) => addBody(b.c, b.k, b.t, b.x, b.y, b.rot, b.ice)); tutorial(); }
else startLevel();
setInterval(() => { tickEnergy(); save(); }, 1000);

// Preload every image behind the loading screen (a failed one still counts, so loading can never hang),
// keep the screen up for at least a moment, then start the pile.
const ASSETS = ['background.webp', 'panel.webp', 'fox.webp', 'sign.png', 'gems.png', 'energy.png', 'menu-panel.webp', 'menu-row.webp', 'menu-row-blue.webp',
  'toast-energy-full.webp', 'toast-energy-25.webp', 'toast-no-space.webp', 'toast-out-of-energy.webp', 'toast-no-energy.webp', 'toast-no-gems.webp', 'toast-fresh-wave.webp', 'toast-frozen.webp', 'toast-no-pair.webp', 'tip-drag.webp', 'toast-blank.webp', 'toast-gift.webp', 'gem.webp', 'win-pill.webp', 'win-gems.webp', 'win-energy.webp', 'win-sparkles.webp', 'call-idle.webp', ...Object.values(BONUSES).map((b) => b.img),
  ...PACKS.flatMap((p) => [p.icon, ...p.e.map((n) => `st-${n}.webp`)])];
const MIN_LOAD_MS = 1500, bootAt = performance.now();
let loaded = 0;
function assetDone() {
  loaded++;
  $('loadFill').style.width = loaded / ASSETS.length * 100 + '%';
  if (loaded < ASSETS.length) return;
  setTimeout(() => {
    $('loading').classList.add('done');
    setTimeout(() => $('loading').remove(), 500);
    last = performance.now(); requestAnimationFrame(frame);
    setTimeout(daily, 900);
  }, Math.max(300, MIN_LOAD_MS - (performance.now() - bootAt)));
}
for (const src of ASSETS) { const img = new Image(); img.onload = img.onerror = assetDone; img.src = src; }
</script>
</body>
</html>
