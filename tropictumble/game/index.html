}
const store = {
  testMode: !LIVE_SHOP,
  // Resolves true only when the store confirms the payment. Cancelling or any error resolves false and grants nothing.
  buy: (product) => !LIVE_SHOP ? new Promise((done) => setTimeout(() => done(true), 700))
    : startShop().then(() => native.Purchases.purchaseStoreProduct({ product: liveProducts[product.id] })).then(() => true)
      .catch((e) => { if (!e?.userCancelled && e?.code !== '1') toast('Purchase did not go through', BLANK); return false; }),
  // Apple requires a way to get one-time purchases back on a new phone. Pretend version: report what this save already owns.
  restore: () => !LIVE_SHOP ? new Promise((done) => setTimeout(() => done(PRODUCTS.filter((p) => p.once && state.purchases[p.id])), 500))
    : startShop().then(() => native.Purchases.restorePurchases()).then(({ customerInfo }) => {
      const owned = new Set(customerInfo.allPurchasedProductIdentifiers || []);
      return PRODUCTS.filter((p) => p.once && owned.has(CONFIG.productIds[p.id]));
    }).catch(() => []),
};
function grant(p) {
  if (p.gems) state.gems += p.gems;
  if (p.boosters) for (const k of Object.keys(state.boosters)) state.boosters[k] += p.boosters;
  if (p.noAds) state.noAds = true;
  if (p.pass) passNow().premium = true;
  state.purchases[p.id] = (state.purchases[p.id] || 0) + 1; track('purchase', { id: p.id, price: p.price });
  renderHud(); renderTools(); save();
}
const GEM = '<img class="gem" src="gem.webp" alt="">';
function shopView() {
  const owned = (p) => p.once && (state.purchases[p.id] || (p.id === 'noads' && state.noAds));
  const buy = (p) => owned(p) ? '<span class="owned">Owned ✓</span>' : `<button class="price" data-act="buy:${p.id}">${p.price}</button>`;
  const wide = (p, cls) => `<div class="offer ${cls}"><div><b>${p.name}</b><small>${p.blurb}</small></div>${buy(p)}</div>`;
  const starter = PRODUCTS[0], noads = PRODUCTS[5];
  return `<div class="shoplogo" role="img" aria-label="Shop"></div>${store.testMode ? '<div class="testmode">Test mode: purchases are pretend. No money is charged.</div>' : ''}
    <div class="balance">${GEM}<b>${state.gems.toLocaleString()}</b></div>${owned(starter) ? '' : wide(starter, '')}
    <div class="packs">${PRODUCTS.slice(1, 5).map((p, i) => `<div class="pk">${p.tag ? `<em>${p.tag}</em>` : ''}<div class="gems g${i}">${GEM}</div><b>${p.name}</b>${buy(p)}</div>`).join('')}</div>
    ${wide(noads, 'plain')}<button data-act="restore" class="linkbtn">Restore purchases</button><button data-act="close" class="alt">Close</button>`;
}
function openShop() {
  openModal(shopView(), shopAct);
  if (LIVE_SHOP && !Object.keys(liveProducts).length) startShop().then(() => { if ($('mcard').querySelector('.packs')) openModal(shopView(), shopAct); }).catch(() => {});
}
function shopAct(act) {
  if (act === 'close') return closeModal();
  if (act === 'back') return openShop();
  if (act === 'restore') return store.restore().then((owned) => {
    if (owned.some((p) => p.noAds)) state.noAds = true;
    for (const p of owned) state.purchases[p.id] ||= 1;
    save(); toast(owned.length ? 'Purchases restored' : 'Nothing to restore', BLANK);
  });
  const [verb, id] = act.split(':'), p = PRODUCTS.find((x) => x.id === id);
  if (verb === 'buy') {
    return openModal(`<div class="mtitle">Confirm</div>${store.testMode ? '<div class="testmode">Test purchase: no money is charged.</div>' : ''}
      <p>Buy <b>${p.name}</b> for <b>${p.price}</b>?</p>${p.blurb ? `<p>${p.blurb}</p>` : ''}<button data-act="pay:${p.id}">Buy</button><button data-act="back" class="alt">Cancel</button>`, shopAct);
  }
  if (verb === 'pay') {
    $('mcard').innerHTML = '<div class="mtitle">Processing…</div>';
    store.buy(p).then((ok) => {
      if (!$('modal').classList.contains('open')) return;   // the save was reset or the screen left while it was processing
      if (!ok) return openShop();
      grant(p); SND.bonus(); openShop();
      toast(p.gems ? `+${p.gems.toLocaleString()} gems` : p.name + ' unlocked', GIFT);
      const r = $('gemsBar').getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2, 14);
    });
  }
}

// ---- Daily reward: grows over a 7-day streak ----
function daily() {
  const day = (ms) => new Date(ms).toLocaleDateString('en-CA'), today = day(Date.now());
  if (state.daily.last === today || state.tut === 0 || $('win').classList.contains('open')) return;
  const streak = state.daily.last === day(Date.now() - 864e5) ? Math.min(7, state.daily.streak + 1) : 1, gems = 10 * streak;
  openModal(`<div class="dailylogo" role="img" aria-label="Daily reward"></div><p>Day ${streak} of 7. Come back tomorrow for more.</p><div class="mreward">+${gems} gems · energy refilled</div><button data-act="claim">Claim</button>`, () => {
    state.daily = { last: today, streak }; state.gems += gems; state.energy = Math.max(state.energy, MAX_ENERGY);
    renderHud(); save(); SND.bonus(); closeModal();
  });
}

// ---- Tutorial: a hand shows the first drag, then two short tips ----
let handTimer = 0, tipTimer = 0;
function showTip(text, ms, art) {
  // Shows as a text pill straight away; switches to the banner art once that image has loaded (and stays text if it is missing).
  const tip = $('tip');
  tip.textContent = text; tip.classList.remove('art', 'blank'); tip.style.backgroundImage = ''; tip.classList.add('on');
  if (art) { const img = new Image(); img.onload = () => { if (tip.textContent === text) { tip.style.backgroundImage = `url(${art})`; tip.classList.add('art'); tip.classList.toggle('blank', art === BLANK); } }; img.src = art; }
  clearTimeout(tipTimer); if (ms) tipTimer = setTimeout(() => $('tip').classList.remove('on'), ms);
}
function tutorial() {
  clearInterval(handTimer);
  if (state.tut === 0) {
    showTip('Drag a sticker onto its twin', 0, 'tip-drag.webp');
    const demo = () => {
      const pair = findPair();
      if (!pair || state.tut !== 0 || drag || $('map').classList.contains('open') || $('modal').classList.contains('open')) return;
      const r = pile.getBoundingClientRect(), at = (b) => ({ left: r.left + b.x + 'px', top: r.top + b.y + 'px' });
      $('hand').animate([{ ...at(pair[0]), opacity: 0, transform: 'scale(1.25)' }, { ...at(pair[0]), opacity: 1, transform: 'scale(1)', offset: 0.18 },
        { ...at(pair[1]), opacity: 1, transform: 'scale(1)', offset: 0.8 }, { ...at(pair[1]), opacity: 0, transform: 'scale(1.1)' }], { duration: 1900, easing: 'ease-in-out' });
    };
    handTimer = setInterval(demo, 2500);
  } else if (state.tut === 1) {
    state.tut = 2; queueTip('Nice! Tap a pack to drop more of its stickers', 5000);
  }
}

// ---- Actions ----
function spawn(c) {
  if (packDone(c)) return toast(PACKS[c].name + ' is finished', BLANK);
  // Whatever finishes a set: the rest of a part-made set of this pack if there is one, otherwise a whole new set of eight.
  // Dealing less would leave a sticker on the pile with no twin to match.
  const part = partKinds(c), k = part.length ? pick(part) : freshKind(c), n = missing(c, k) || SET;
  if (bodies.length + n > capacity()) return toast('Not enough space', 'toast-no-space.webp');
  if (state.energy < 1) return toast('Out of energy', 'toast-out-of-energy.webp');
  state.energy--;
  const nb = dropIn(c, k, 0);
  for (let i = 1; i < n; i++) dropIn(c, k, 0, i * 0.3);
  SND.drop();
  burst(pile.getBoundingClientRect().left + nb.x, pile.getBoundingClientRect().top + 8, 4);
  tickEnergy(); save();
}

// Nearest identical sticker close enough to the held one to merge with.
function mergeTarget(a) {
  let best = null, bestD = R * 2.2;
  for (const b of bodies) {
    if (b === a || b.ice || !sameKind(a, b)) continue;
    const d = Math.hypot(b.x - a.x, b.y - a.y);
    if (d < bestD) { bestD = d; best = b; }
  }
  return best;
}

function merge(a, b) {
  buzz(15);
  const pr = pile.getBoundingClientRect(), mx = pr.left + (a.x + b.x) / 2, my = pr.top + (a.y + b.y) / 2, c = a.c;
  // a match cracks any ice next to it
  for (const o of bodies) {
    if (o.ice && Math.min(Math.hypot(o.x - a.x, o.y - a.y), Math.hypot(o.x - b.x, o.y - b.y)) < R * 3.2) thaw(o);
  }
  if (a.t < 2) {
    // two outlines make a black one, two black ones a colour one: it appears where the two met
    const up = addBody(c, a.k, a.t + 1, (a.x + b.x) / 2, (a.y + b.y) / 2, (a.rot + b.rot) / 2);
    removeBody(a); removeBody(b); setTier(up, true);
    state.matches++; onMatch(c);
    if (up.t === 1 && once('tier1')) queueTip('Two jellies make a painted sticker. Merge two painted ones next!', 5000);
    if (up.t === 2 && once('tier2')) queueTip('Shiny! Match two shiny stickers to collect them', 5000);
  } else {
    flyToPack(a); flyToPack(b); removeBody(a); removeBody(b);
    state.counts[c]++; state.matches++; state.album[c][a.k] = (state.album[c][a.k] || 0) + 1; onMatch(c, true); gainSticker(PACKS[c].e[a.k]); passAdd(2);
    if (state.album[c][a.k] === ALBUM_GOAL && once('album')) queueTip('Sticker collected! See it in your album');
  }
  const pts = 100 * Math.min(run.combo, 5);          // quick matches are worth up to five times as much
  state.score += pts; SND.pop(run.combo);
  burst(mx, my, 14); floatText(mx, my - R, '+' + pts);
  if (packDone(c)) bodies.filter((o) => o.c === c).forEach((o) => { flyToPack(o); removeBody(o); });
  if (state.tut === 0) { state.tut = 1; tutorial(); }
  renderHud(c); save();
  if (checkGoal()) return;
  // Pile cleared (or nothing left that matches): a fresh wave tumbles in, free.
  if (!hasMove()) setTimeout(() => { if (!hasMove() && !ending) { refill(); toast('Fresh wave!', 'toast-fresh-wave.webp'); SND.wave(); save(); checkGoal(); } }, 500);
}

function flyToPack(b) {
  const from = pile.getBoundingClientRect(), to = document.querySelector(`[data-pack="${b.c}"]`).getBoundingClientRect();
  const f = document.createElement('div');
  f.className = 'fly'; f.style.backgroundImage = art(b, 2); f.style.width = f.style.height = R * 2 + 'px';
  const x0 = from.left + b.x, y0 = from.top + b.y, x1 = to.left + to.width / 2, y1 = to.top + to.height / 2;
  f.style.left = x0 + 'px'; f.style.top = y0 + 'px';
  document.body.appendChild(f);
  f.animate([{ left: x0 + 'px', top: y0 + 'px', opacity: 1, transform: 'translate(-50%, -50%) scale(1.3) rotate(0deg)' }, { left: x1 + 'px', top: y1 + 'px', opacity: 0.8, transform: 'translate(-50%, -50%) scale(.45) rotate(360deg)' }],
    { duration: 380, easing: 'ease-in' });
  setTimeout(() => { f.remove(); burst(x1, y1, 5); }, 380);
}

function win() {
  if ($('win').classList.contains('open')) return;
  // Stars come from points per match: a plain match is 100, a full combo 500, and bonuses add more. It works the same for every goal.
  const perMatch = state.matches ? state.score / state.matches : 0, stars = perMatch >= 500 ? 3 : perMatch >= 300 ? 2 : 1;
  const before = state.stars[state.page] || 0, first = !before;
  // The full reward is for the first clear. A replay pays a small tip, plus a booster for each star it adds.
  const newStars = Math.max(0, stars - Math.max(before, 1)), keys = Object.keys(state.boosters);
  for (let i = 0; i < newStars; i++) state.boosters[pick(keys)]++;
  winGems = first ? WIN_GEMS : REPLAY_GEMS;
  state.gems += winGems; if (first) gainEnergy(WIN_ENERGY);
  state.stars[state.page] = Math.max(before, stars); state.done = true;
  track('level_win', { stars, score: state.score, matches: state.matches, first }); passAdd(10 * stars);
  if (state.page === state.maxPage) state.maxPage++;
  renderWin(stars, newStars, first);
  renderHud(); renderTools(); save(); $('win').classList.add('open'); confetti(); SND.win();
}
$('next').onclick = () => ads.interstitial().then(() => {
  state.page = Math.min(state.page + 1, state.maxPage); $('win').classList.remove('open'); startLevel();
});

// ---- Input: tap a pack to drop stickers, drag a sticker onto an identical one ----
$('tray').addEventListener('click', (e) => { const b = e.target.closest('[data-pack]'); if (b) spawn(+b.dataset.pack); });

let drag = null;
function local(e) { const r = pile.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
pile.addEventListener('pointerdown', (e) => {
  if (drag) return;
  const p = local(e);
  let hit = null, hitD = R * 1.25;
  for (const b of bodies) { const d = Math.hypot(b.x - p.x, b.y - p.y); if (d < hitD) { hitD = d; hit = b; } }
  if (!hit) return;
  if (hit.ice) { fx(els.get(hit.id), 'shake'); SND.nope(); return toast('Frozen! Make a match next to it', 'toast-frozen.webp'); }
  e.preventDefault();
  try { pile.setPointerCapture(e.pointerId); } catch {}
  drag = { b: hit, id: e.pointerId, ox: hit.x - p.x, oy: hit.y - p.y, x0: hit.x, y0: hit.y };
  els.get(hit.id).classList.add('held');
});
pile.addEventListener('pointermove', (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  const p = local(e), b = drag.b;
  b.x = b.px = Math.max(R, Math.min(W - R, p.x + drag.ox));
  b.y = b.py = Math.max(R, Math.min(H - R, p.y + drag.oy));
});
function endDrag(e) {
  if (!drag || e.pointerId !== drag.id) return;
  // A match needs a real drag: a tap on a sticker that happens to touch its twin does nothing.
  const b = drag.b, dragged = Math.hypot(b.x - drag.x0, b.y - drag.y0) > R * 0.5;
  const t = e.type === 'pointerup' && dragged ? mergeTarget(b) : null;
  els.get(b.id)?.classList.remove('held');
  drag = null;
  try { pile.releasePointerCapture(e.pointerId); } catch {}
  if (t) return merge(b, t);
  // Dropped on a different sticker: a little "nope" wobble before it falls back into the pile.
  if (e.type === 'pointerup' && dragged && bodies.some((o) => o !== b && Math.hypot(o.x - b.x, o.y - b.y) < R * 1.5)) {
    fx(els.get(b.id), 'shake'); onMiss(); SND.nope();
    // Same design but a different stage: say why it did not match, instead of only shaking.
    const twin = bodies.find((o) => o !== b && !o.ice && o.c === b.c && o.k === b.k && o.t !== b.t && Math.hypot(o.x - b.x, o.y - b.y) < R * 2.2);
    if (twin) toast(`One is ${TIER_WORD[Math.min(b.t, twin.t)]}, one is ${TIER_WORD[Math.max(b.t, twin.t)]}. Match two the same`, BLANK);
  }
  save();
}
pile.addEventListener('pointerup', endDrag);
pile.addEventListener('pointercancel', endDrag);

function energyAd() {
  if (state.energy >= MAX_ENERGY) return toast('Energy is full!', 'toast-energy-full.webp');
  ads.rewarded().then((ok) => {
    if (!ok) return;
    gainEnergy(AD_ENERGY); tickEnergy(); save(); SND.bonus(); toast('+25 energy', 'toast-energy-25.webp');
  });
}
// + buttons: energy stands in for a rewarded ad, gems for the shop.
$('stats').addEventListener('click', (e) => {
  // The whole bar is the button: it squashes under the finger, bounces back and throws a few sparkles from its +.
  const bar = e.target.closest('.bar');
  if (!bar) return;
  const k = bar.id === 'energyBar' ? 'energy' : 'gems', plus = bar.querySelector('button').getBoundingClientRect();
  fx(bar, 'boing', 450); burst(plus.left + plus.width / 2, plus.top + plus.height / 2, 5);
  if (k === 'energy') energyAd();
  if (k === 'gems') openShop();
});

// ---- Cheats ----
function setMenu(open) { $('cheats').classList.toggle('open', open); $('gear').classList.toggle('on', open); }
$('gear').onclick = () => setMenu(!$('cheats').classList.contains('open'));
document.addEventListener('pointerdown', (e) => {
  if ($('cheats').classList.contains('open') && !e.target.closest('#cheats, #gear')) setMenu(false);
}, true);
$('cheats').addEventListener('click', (e) => {
  const k = e.target.closest('[data-cheat]')?.dataset.cheat;
  if (!k) return;
  setMenu(false);
  if (k === 'energy') gainEnergy(50);
  if (k === 'fill') { ending = true; clearBodies(); return win(); }
  if (k === 'reset') { state = fresh(); closeModal(); return startLevel(); }
  const quieter = (v) => v > 0.8 ? 0.6 : v > 0.4 ? 0.3 : v > 0 ? 0 : 1;      // 100% -> 60% -> 30% -> off -> 100%
  if (k === 'sound') { state.sfxVol = quieter(state.sfxVol); if (ac) sfxOut.gain.value = 0.9 * state.sfxVol; renderSound(); SND.click(); setMenu(true); }
  if (k === 'music') {
    state.musVol = quieter(state.musVol); renderSound(); setMenu(true);
    if (!state.musVol) stopMusic(); else if (musicTimer) musicOut.gain.setTargetAtTime(0.8 * state.musVol, ac.currentTime, 0.2); else startMusic();
  }
  if (k === 'help') return openHelp();
  if (k === 'notes') return toggleNotes().then(renderSound);
  renderHud(); save();
});

function renderSound() {
  const pct = (v) => v ? Math.round(v * 100) + '%' : 'off';
  $('soundRow').textContent = (state.sfxVol ? '🔊' : '🔇') + ' Sound: ' + pct(state.sfxVol);
  $('musicRow').textContent = '🎵 Music: ' + pct(state.musVol);
  $('notesRow').textContent = '🔔 Reminders: ' + (state.notes === 1 ? 'on' : 'off');
}

// ---- Boot ----
// In the app: bring the save back if the phone cleared web storage, and make Android's back button pause or close what is open.
if (native?.Preferences && !localStorage.getItem(SAVE_KEY)) {
  native.Preferences.get({ key: SAVE_KEY }).then((r) => { if (r?.value) { try { localStorage.setItem(SAVE_KEY, r.value); location.reload(); } catch {} } }).catch(() => {});
}
native?.App?.addListener('backButton', () => {
  if ($('ad').classList.contains('open')) return;
  if ($('cheats').classList.contains('open')) setMenu(false);
  else if ($('modal').classList.contains('open')) closeModal();
  else if ($('party').classList.contains('open')) return;
  else if ($('scene').classList.contains('open')) closeScene();
  else if ($('coll').classList.contains('open')) closeColl();
  else if ($('map').classList.contains('open')) closeMap();
  else if (!$('win').classList.contains('open')) openPause();
});
renderHud();                         // tray first, so the pile is measured at its real height
measure();
new ResizeObserver(measure).observe(pile);
// Reopened on a finished level (closed before tapping Next): go straight back to the completed screen, rewards already paid.
const finished = !!state.done;
$('app').classList.toggle('debug', DEBUG); setWorld(state.page);
renderTools(); renderSound(); pile.classList.toggle('tide', TIDE_S > 0);
if (finished) { renderWin(state.stars[state.page] || 1, 0, true); $('win').classList.add('open'); }
else if (state.bodies?.length) { state.bodies.filter((b) => PACKS[b.c]?.e[b.k]).forEach((b) => addBody(b.c, b.k, b.t, b.x, b.y, b.rot, b.ice)); if (tidyPile()) save(); tutorial(); }
else startLevel();
setInterval(() => {
  tickEnergy(); save();
  // safety net: if the goal is already met and nothing is on top of the game, finish the level
  if (bodies.length && !$('win').classList.contains('open') && !$('modal').classList.contains('open') && !$('ad').classList.contains('open')) checkGoal();
}, 1000);

// Preload every image behind the loading screen (a failed one still counts, so loading can never hang),
// keep the screen up for at least a moment, then start the pile.
const stickerArt = (c) => [PACKS[c].icon, ...PACKS[c].e.flatMap((n) => TIER_ART.map((t) => `st-${n}${t}.webp`))];
const ASSETS = ['background.webp', 'panel.webp', 'fox.webp', 'sign.webp', 'gems.webp', 'energy.webp', 'menu-panel.webp', 'menu-row.webp', 'menu-row-blue.webp',
  'tool-hint.webp', 'tool-shuffle.webp', 'tool-magnet.webp', 'tool-album.webp', 'home-btn.webp', 'star.webp', 'gem.webp', 'toast-blank.webp', 'call-idle.webp',
  `world-${worldOf(state.page)}.webp`, 'play-button.webp', 'hub-bg.webp', 'nav-bar.webp', 'nav-on.webp', 'nav-stories.webp', 'nav-home.webp', 'logo-board.webp', 'hub-sand.webp', 'home-button.webp', 'scene-frame.webp', 'scene-frame-on.webp',
  ...levelPacks().flatMap(stickerArt)];
// The rest: reward screens, messages, the map, and the stickers of sets not in this level. Fetched a few at a time once the game
// is running, so the first use of each is instant, without holding up the start.
const LATER = ['toast-energy-full.webp', 'toast-energy-25.webp', 'toast-no-space.webp', 'toast-out-of-energy.webp', 'toast-no-energy.webp', 'toast-no-gems.webp', 'toast-fresh-wave.webp', 'toast-frozen.webp', 'toast-no-pair.webp', 'toast-gift.webp', 'tip-drag.webp',
  'win-card.webp', 'win-pill.webp', 'win-gems.webp', 'win-energy.webp', 'pop-cone.webp', 'pop-burst.webp', 'pop-pink.webp', 'pop-blue.webp', 'pop-stars.webp', ...Object.values(BONUSES).map((b) => b.img),
  'map-stars.webp', 'map-chest-bar.webp', 'map-node.webp', 'map-star.webp', 'map-crown.webp', 'map-lock.webp', 'map-banner.webp', 'map-logo.webp', 'map-back.webp', 'map-chest.webp', 'scene-hud.webp', 'scene-title.webp', sceneBg(state.sceneIdx % SCENE_NAMES.length),
  ...PACKS.flatMap((_, c) => levelPacks().includes(c) ? [] : stickerArt(c))].filter((f) => !ASSETS.includes(f));
function loadLater(i = 0) {
  if (i >= LATER.length) return;
  const next = () => (window.requestIdleCallback || setTimeout)(() => loadLater(i + 3), { timeout: 1500 });
  let left = 0; for (const src of LATER.slice(i, i + 3)) { left++; const img = new Image(); img.onload = img.onerror = () => { if (!--left) next(); }; img.src = src; }
}
const MIN_LOAD_MS = 1500, bootAt = performance.now();
let loaded = 0;
function assetDone() {
  loaded++;
  $('loadFill').style.width = loaded / ASSETS.length * 100 + '%';
  if (loaded < ASSETS.length) return;
  setTimeout(() => {
    $('loading').classList.add('done');
    setTimeout(() => $('loading').remove(), 500);
    last = performance.now(); requestAnimationFrame(frame); setTimeout(loadLater, 2500);
    if (state.tut > 0 && !finished) openColl();   // returning players start at the hub; a first-time player goes straight into level 1
    setTimeout(daily, 900);
  }, Math.max(300, MIN_LOAD_MS - (performance.now() - bootAt)));
}
for (const src of ASSETS) { const img = new Image(); img.onload = img.onerror = assetDone; img.src = src; }
</script>
