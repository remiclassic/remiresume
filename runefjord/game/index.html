  /* Loading screen: covers the game until every image is in, then fades away. */
  /* Home and loading screens: the harbour painting (art/paintings/hub-bg.webp, 760 x 1350) comes alive. .bgfx is laid exactly over the painting, so its
     pieces are placed in % of the picture: clouds over the peaks, fog along the waterline, falling water, light on the fjord, and the braziers' glow.
     Every piece starts from the same clock (--t), so redrawing a screen does not make the weather jump. */
  .bgfx { position: absolute; z-index: -1; overflow: hidden; pointer-events: none; }
  .bgfx > * { position: absolute; animation-delay: calc(var(--t) * -1s - var(--d, 0s)) !important; }
  .bgfx .cloud { left: -75%; width: 75%; height: 9%; border-radius: 50%; filter: blur(7px); opacity: .5;
    background: radial-gradient(ellipse 34% 60% at 28% 55%, #fff, transparent 70%), radial-gradient(ellipse 40% 70% at 58% 45%, #ffffffe0, transparent 70%), radial-gradient(ellipse 28% 50% at 82% 60%, #ffffffc0, transparent 70%);
    animation: bgCloud linear infinite; }
  .bgfx .fog { left: 0; width: 200%; filter: blur(5px); animation: bgFog linear infinite;
    background: radial-gradient(ellipse 16% 55% at 12% 50%, #fff, transparent 70%), radial-gradient(ellipse 20% 45% at 34% 60%, #ffffffd0, transparent 70%),
      radial-gradient(ellipse 16% 55% at 62% 50%, #fff, transparent 70%), radial-gradient(ellipse 20% 45% at 84% 60%, #ffffffd0, transparent 70%); }   /* the pattern repeats half way along, so the loop has no seam */
  .bgfx .sheen { mix-blend-mode: soft-light; opacity: .55; animation: bgSheen 7s linear infinite;
    background: repeating-linear-gradient(176deg, transparent 0 9px, #ffffff66 11px 13px, transparent 15px 26px);
    -webkit-mask-image: radial-gradient(ellipse 50% 55% at 50% 45%, #000 40%, transparent 100%); mask-image: radial-gradient(ellipse 50% 55% at 50% 45%, #000 40%, transparent 100%); }
  .bgfx .gl { height: 2px; border-radius: 50%; background: #fff; box-shadow: 0 0 5px #cfe9ff; opacity: 0; animation: bgGlint ease-in-out infinite; }
  .bgfx .mist { border-radius: 50%; background: radial-gradient(#ffffffd0, transparent 68%); filter: blur(3px); transform: translate(-50%, -50%); animation: bgMist 4.5s ease-in-out infinite alternate; }
  .bgfx .fire { border-radius: 50%; background: radial-gradient(#ffc56ab0, #ff9a3a40 45%, transparent 70%); mix-blend-mode: screen; transform: translate(-50%, -50%); animation: bgFire 3.4s ease-in-out infinite; }   /* window light: slow and soft */
  @keyframes bgCloud { to { transform: translateX(235%); } }
  @keyframes bgFog { to { transform: translateX(-50%); } }
  @keyframes bgSheen { to { background-position: 0 26px; } }
  @keyframes bgGlint { 0%, 100% { opacity: 0; transform: scaleX(.4); } 50% { opacity: .9; transform: scaleX(1); } }
  @keyframes bgMist { from { opacity: .35; transform: translate(-50%, -50%) scale(.85); } to { opacity: .75; transform: translate(-50%, -58%) scale(1.2); } }
  @keyframes bgFire { 0%, 100% { opacity: .55; transform: translate(-50%, -50%) scale(1); } 22% { opacity: .85; transform: translate(-50%, -52%) scale(1.12); } 47% { opacity: .5; transform: translate(-50%, -50%) scale(.95); } 71% { opacity: .9; transform: translate(-50%, -53%) scale(1.15); } }
  .lite .bgfx { display: none; }
  @media (prefers-reduced-motion: reduce) { .bgfx { display: none; } }
  #loading { position: absolute; inset: 0; z-index: 100; background: #1c2a3a url(art/paintings/loading.webp) center / cover no-repeat;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 8px; padding-bottom: calc(7% + env(safe-area-inset-bottom));
    transition: opacity .45s, transform .45s; }
  #loading.done { opacity: 0; transform: scale(1.06); pointer-events: none; }
  /* The same bar as the Saga Pass (art/ui/pass-bar.webp): a knotwork trough in a studded gold rim, with the fill lying in the trough */
  #loadTrack { box-sizing: border-box; width: 70%; height: 34px; padding: 10px 12px 9.5px; border: 0 solid transparent; border-image: url(art/ui/pass-bar.webp) 0 76 fill / 0 22.3px stretch; filter: drop-shadow(0 3px 5px #0008); }
  #loadFill { width: 0; height: 100%; border-radius: 99px; background: linear-gradient(#f2c869, #d99a34); box-shadow: inset 0 2px 0 #f5e4c2; transition: width .25s; }
  #loadText { font: 700 18px/1 Cinzel, system-ui, sans-serif; color: #fff; -webkit-text-stroke: 2px #3a2210; paint-order: stroke fill; }

  /* ---- Micro animations and effects ---- */
  #gear { transition: transform .35s cubic-bezier(.3, 1.6, .5, 1); }

  #gear.on:active { transform: rotate(90deg) scale(.88); }

  #cheats.open button:nth-child(2) { animation-delay: .05s; }
  #cheats.open button:nth-child(3) { animation-delay: .1s; }
  #cheats.open button:nth-child(4) { animation-delay: .15s; }
  #cheats.open button:nth-child(5) { animation-delay: .2s; }
  #cheats.open button:nth-child(6) { animation-delay: .25s; }

  .bar:active { transform: scale(.92); }

  .pack:active span.e { transform: scale(1.12) rotate(-6deg); }
  #bar i { position: relative; overflow: hidden; }
  #bar i::after { content: ''; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 35%, #ffffffb0 50%, transparent 65%);
    transform: translateX(-100%); animation: shine 2.8s ease-in-out infinite; }
  #toast.show { animation: toastIn .3s cubic-bezier(.2, 1.5, .4, 1); }
  #win { overflow: hidden; }
  #next { animation: pulse 1.1s ease-in-out infinite alternate; }
  .spark { position: fixed; z-index: 31; pointer-events: none;
    clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); }
  .float { position: fixed; z-index: 32; pointer-events: none; transform: translate(-50%, -50%); white-space: nowrap;
    font: 700 24px/1 Cinzel, system-ui, sans-serif; color: #fff; -webkit-text-stroke: 2.5px #e8830c; paint-order: stroke fill; }
  .confetti { position: absolute; top: -20px; width: 9px; height: 14px; border-radius: 2px; pointer-events: none; }
  /* Fox: its own cut-out layered exactly over the fox in art/ui/panel.webp. Animations only ever scale it up, so the one underneath never shows. */
  #trayInner { display: contents; }
  #fox { position: absolute; left: 4.5%; top: -7%; width: 32%; height: 55%;   /* the wolf leans over the frame: its claws hang down onto the top beam */ z-index: 1; background: url(art/icons/fox.webp) center / 100% 100% no-repeat;
    transform-origin: 50% 100%; animation: breathe 3.2s ease-in-out infinite; }
  #fox.hop { animation: foxHop .65s cubic-bezier(.3, 1.4, .5, 1); }
  #fox.howl { animation: wolfHowl 1.9s ease-in-out; }                 /* tapped: the wolf throws its head back and howls */
  #fox.howl.pic { background-image: url(art/icons/fox-howl.webp); top: -9.17%; height: 57.17%; }   /* its howling picture (540 x 447: taller than the resting one, so the box grows upward and the paws stay put) */
  #fox.howl.pic { animation-name: wolfHowlPic; }                      /* the picture already has the head thrown back, so it only swells a little with the note */
  @keyframes wolfHowlPic { 0%, 100% { transform: none; } 20% { transform: scale(1.05, 1.07); } 55% { transform: scale(1.07, 1.09) rotate(-1.5deg); } 85% { transform: scale(1.04, 1.05); } }
  @keyframes wolfHowl { 0%, 100% { transform: none; } 16% { transform: rotate(-5deg) scale(1.04, 1.13); } 50% { transform: rotate(-6deg) scale(1.05, 1.15); } 82% { transform: rotate(-5deg) scale(1.04, 1.12); } }
  .raven { position: fixed; z-index: 30; pointer-events: none; filter: drop-shadow(0 2px 2px #0006); }
  .raven svg { display: block; width: 100%; overflow: visible; }
  .raven .b { fill: #15131d; stroke: #7d93d6; stroke-width: .7; stroke-linejoin: round; }
  .raven .w { fill: #1d1b29; stroke: #7d93d6; stroke-width: .7; stroke-linejoin: round; transform-box: view-box; animation: .19s ease-in-out infinite alternate; }
  .raven .w.r { transform-origin: 54.7% 42%; animation-name: ravenFlapR; }
  .raven .w.l { transform-origin: 45.3% 42%; animation-name: ravenFlapL; }
  .raven .e { fill: #8fd6ff; }
  @keyframes ravenFlapR { from { transform: rotate(-26deg); } to { transform: rotate(22deg); } }
  @keyframes ravenFlapL { from { transform: rotate(26deg); } to { transform: rotate(-22deg); } }
  @keyframes breathe { 50% { transform: scale(1.02, 1.045); } }
  @keyframes foxHop { 0% { transform: scale(1); } 18% { transform: scale(1.18, 1.02); } 45% { transform: scale(1.05, 1.26) rotate(-3deg); }
    70% { transform: scale(1.15, 1.05) rotate(2.5deg); } 100% { transform: scale(1); } }

  /* Bonus callouts sit in the panel's bump above the progress bar; the blue paw plate fills that spot when nothing is showing. */
  #idlePlate { display: none; position: absolute; left: 35.7%; top: 15.2%; width: 33.6%; aspect-ratio: 3.51; pointer-events: none;   /* the frame's own rune arch stands here now */
    background: url(art/lettering/call-idle.webp) center / 100% 100% no-repeat; transition: opacity .2s, transform .25s cubic-bezier(.3, 1.6, .5, 1); }
  #tray.calling #idlePlate { opacity: 0; transform: scale(.7); }
  #callout { position: absolute; left: 52.5%; top: 25%; width: 80%; aspect-ratio: 4.9; z-index: 3; pointer-events: none; opacity: 0;
    transform: translate(-50%, -50%) scale(0); background: center / contain no-repeat; filter: drop-shadow(0 3px 4px #0005); }
  #callout.show { animation: callIn 1.6s both; }
  @keyframes callIn { 0% { transform: translate(-50%, -50%) scale(0) rotate(-8deg); opacity: 0; }
    12% { transform: translate(-50%, -64%) scale(1.18) rotate(2deg); opacity: 1; } 20% { transform: translate(-50%, -60%) scale(1) rotate(0deg); opacity: 1; }
    50% { transform: translate(-50%, -60%) scale(1.04) rotate(-1deg); opacity: 1; } 82% { transform: translate(-50%, -60%) scale(1) rotate(0deg); opacity: 1; }
    100% { transform: translate(-50%, -95%) scale(.85); opacity: 0; } }

  /* Ambient background life: positions are computed in JS from where things sit in art/paintings/background.webp. */
  #fxBg { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  #water { position: absolute; left: 0; right: 0; overflow: hidden; }
  #water::before { content: ''; position: absolute; inset: 0 -70px; mix-blend-mode: soft-light;
    background: repeating-linear-gradient(95deg, transparent 0 22px, #ffffff66 26px 30px, transparent 34px 60px);
    -webkit-mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent); mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent);
    animation: shimmer 5s linear infinite; }
  .glint { position: absolute; height: 2.5px; border-radius: 50%; background: #fff; box-shadow: 0 0 4px #fff; animation: glint ease-in-out infinite; }
  .tw { position: absolute; background: radial-gradient(#fff 25%, #fff3a8 55%, #ffd95a); animation: twinkle ease-in-out infinite;
    clip-path: polygon(50% 0, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0 50%, 40% 40%); }
  .tw.w { background: #fff; }
  @keyframes shimmer { 100% { transform: translateX(60.2px); } }
  @keyframes glint { 0%, 100% { opacity: 0; transform: translate(-50%, -50%) scaleX(.3); } 50% { opacity: .95; transform: translate(-50%, -50%) scaleX(1); } }
  @keyframes twinkle { 0%, 100% { transform: translate(-50%, -50%) scale(.45) rotate(0deg); opacity: .35; }
    50% { transform: translate(-50%, -50%) scale(1.25) rotate(25deg); opacity: 1; } }
  @keyframes boing { 0% { transform: scale(.88); } 45% { transform: scale(1.1) rotate(-2.5deg); } 75% { transform: scale(.98) rotate(1deg); } }
  @keyframes menuIn { 0% { transform: scale(.6); opacity: 0; } }
  @keyframes rowIn { 0% { transform: translateX(-16px); opacity: 0; } }
  @keyframes sway { 0%, 100% { transform: translateX(-50%) rotate(-1.6deg); } 50% { transform: translateX(-50%) rotate(1.6deg); } }
  @keyframes numPop { 0% { transform: scale(1.5); } }
  @keyframes shake { 20% { transform: translateX(-6px) rotate(-10deg); } 50% { transform: translateX(6px) rotate(10deg); } 80% { transform: translateX(-3px) rotate(-5deg); } }
  @keyframes shine { 0%, 55% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
  @keyframes toastIn { 0% { transform: translateX(-50%) scale(.6); } }
  @keyframes popper { 0% { transform: rotate(-8deg) scale(1); } 100% { transform: rotate(8deg) scale(1.1); } }
  @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.05); } }
  @media (prefers-reduced-motion: reduce) { .fall, .caustic, .glow, .rays, .twk, #fox, #water::before, .glint, .tw, #sign, #bar i::after, #next, .popper i, .evstar i, .st.t2::before, #guideSpot, .gfox { animation: none; } .pchest { animation: none !important; } .popper .spray { opacity: 1; } }

  /* ---- One look for everything that was still plain: vellum in a bronze edge for panels, the shop's scroll for a single line of reward or goal,
     dark brown lettering on both, and gold-on-iron for count badges. Set last so it wins over the older rules above. ---- */
  #mcard p { max-width: 94%; color: #3a2210; font: 600 15px/1.4 Georgia, 'Times New Roman', serif; }
  #mcard p b { color: #8a3c08; }
  #mcard .overlogo + p { font: 700 15px/1.25 Cinzel, system-ui, sans-serif; color: #5a3410; }
  .mreward { box-sizing: border-box; min-width: 62%; max-width: 100%; padding: 12px 30px 13px; white-space: nowrap; border: 0 solid transparent; border-radius: 0; background: none; border-image: url(art/shop/scroll.webp) 0 70 fill / 0 24px stretch;
    filter: drop-shadow(0 2px 2px #0005); color: #3a2210; font: 700 13.5px/1.15 Cinzel, system-ui, sans-serif; }   /* one line: the longest, "+30 gems · energy refilled", fits the scroll at this size */
  .help li { background: linear-gradient(#f6e6bd, #ecd29c); border: 2px solid #8a5a22; box-shadow: inset 0 0 0 2px #fbf0d0, inset 0 0 16px #b07a3050, 0 2px 3px #0004; border-radius: 10px; padding: 8px 12px; color: #3a2210; font: 600 14px/1.4 Georgia, 'Times New Roman', serif; }
  .help b { color: #8a3c08; font: 700 14px/1 Cinzel, system-ui, sans-serif; }
  .chest { background: linear-gradient(#f6e6bd, #ecd29c); border: 2px solid #8a5a22; box-shadow: inset 0 0 0 2px #fbf0d0, inset 0 0 16px #b07a3050, 0 2px 3px #0004; border-radius: 10px; color: #5a3410; }
  #mcard .lv.locked { background: linear-gradient(#b5a68c, #8d7c63); border-color: #5f5040; color: #efe6d2; opacity: .8; }
  /* No button is drawn in code any more. Pill buttons outside the pop-ups' own rows (claim all on the Saga Pass, an event card's button, a claim on an album page)
     are the same painted plank between two rune medallions as a pop-up's buttons (art/ui/bar-gold.webp). */
  #hubBody .passall, .ecard button, #mcard button[data-act^="claim"]:not(:only-of-type) { flex: none; box-sizing: border-box; min-width: 150px; width: auto; height: 42px; padding: 0 44px 2px; border: 0 solid transparent; border-radius: 0; background: none; box-shadow: none;
    border-image: url(art/ui/bar-gold.webp) 0 97 fill / 0 57px stretch; filter: drop-shadow(0 3px 3px #0006); color: #fff; font: 700 14px/1 Cinzel, system-ui, sans-serif; white-space: nowrap; -webkit-text-stroke: 2.5px #5a3410; paint-order: stroke fill; }
  #hubBody .passall { min-width: 230px; }
  /* The level grid's tiles are the Saga Pass's painted tier shield; a locked one is the same shield greyed. The profile's two tabs are planks too: gold for the one chosen. */
  #mcard .lv, #mcard .lv.locked { border: 0; border-radius: 0; box-shadow: none; background: url(art/ui/pass-tier.webp) center / 100% 100% no-repeat; filter: drop-shadow(0 2px 2px #0006); color: #fff3d6; -webkit-text-stroke: 2.5px #3a1d08; }
  #mcard .lv.locked { filter: grayscale(.85) brightness(.8) drop-shadow(0 2px 2px #0006); opacity: 1; }
  #mcard .lv.cur { outline: 0; filter: drop-shadow(0 0 5px #ffd24a) drop-shadow(0 0 2px #ffb300); }
  #mcard .ptabs button, #mcard .ptabs button.on { height: 38px; padding: 0 0 2px; border: 0 solid transparent; border-radius: 0; background: none; box-shadow: none; border-image: url(art/ui/bar-wood.webp) 0 97 fill / 0 52px stretch; color: #fff3d6; font-size: 14px; -webkit-text-stroke: 2.5px #2a1608; paint-order: stroke fill; filter: drop-shadow(0 2px 2px #0006); }
  #mcard .ptabs button.on { border-image-source: url(art/ui/bar-gold.webp); -webkit-text-stroke-color: #5a3410; }
  .loot div { background: linear-gradient(#f6e6bd, #ecd29c); border: 2px solid #8a5a22; box-shadow: inset 0 0 0 2px #fbf0d0, inset 0 0 16px #b07a3050, 0 2px 3px #0004; border-radius: 10px; }
  .testmode { background: #f1dcae; border: 2px dashed #8a5a22; border-radius: 8px; color: #5a3410; font: 700 12px/1.3 Cinzel, system-ui, sans-serif; }
  .spage { border: 3px solid #8a5a22; border-radius: 8px; box-shadow: 0 0 0 2px #3d1f0a, 0 3px 5px #0006; }
  #tools em, .slot em, #sceneTray button em { background: radial-gradient(circle at 35% 30%, #ffe9a8, #e0a83c 60%, #a86a1c); border: 1.5px solid #3d1f0a; color: #2a1608; box-shadow: 0 1px 3px #0009; line-height: 18px; }
  #sceneTray button em, .slot em { line-height: 20px; }
  /* The first-time guide speaks from a painted board (art/ui/guide-card.webp, 1000 x 323): the wolf in an iron ring, and a sheet of vellum for one sentence. The board is a little wider
     than the screen; its words are sized from its width so they always sit on the vellum, and Skip, the step dots and Next hang under it. */
  #guideCard { container-type: inline-size; left: -6%; right: -6%; min-height: 0; padding: 0; border: 0; border-radius: 0; background: none; box-shadow: none; }
  #guideCard::before { content: ''; display: block; width: 100%; aspect-ratio: 1000 / 323; background: url(art/ui/guide-card.webp) center / 100% 100% no-repeat; filter: drop-shadow(0 6px 8px #000a); }
  #guideCard .gfox { display: none; }
  #guideText { position: absolute; left: 35cqw; right: 9.5cqw; top: 6.4cqw; height: 20.4cqw; margin: 0; display: block; align-content: center; color: #3a2210; font: 700 3.25cqw/1.22 Cinzel, system-ui, sans-serif; text-wrap: balance; }
  #guideText b { color: #8a3c08; }
  #guideCard .grow { margin: 1.5cqw 9% 0; }
  #guideSkip { color: #f1dcae; text-shadow: 0 1px 2px #000; }
  #guideDots i { background: #f1dcae66; box-shadow: 0 0 0 1px #0006; }
  #guideDots i.on { background: #f2b705; }
  #tip:not(.art) { border: 2px solid #3d1f0a; border-radius: 10px; background: linear-gradient(#f8ebc6, #ecd29c); box-shadow: inset 0 0 0 2px #fbf0d0, 0 4px 10px #0007; color: #3a2210; }
  #guideNext, #mcard .ahead button, #mcard .chest button { box-sizing: border-box; min-width: 0; height: 38px; padding: 0 26px 2px; border: 0 solid transparent; border-radius: 0; background: none; box-shadow: none;
    border-image: url(art/shop/price.webp) 0 46 fill / 0 19.4px stretch; filter: drop-shadow(0 2px 2px #0006); font-size: 15px; -webkit-text-stroke: 2px #5a3410; white-space: nowrap; }   /* small buttons are the shop's gold price plate */
  /* ---- The reward sign (scene finished, level up, event complete). It is the pop-ups' own frame: parchment in timber with wolf heads and rune banners, wider than
     the game's column. The star turns on its top rail; the title, a REWARD scroll, the prizes and two plank buttons sit on the parchment in a column. ---- */
  .evcard { --ew: calc(min(100vw, 480px) * 1.16); flex: none; box-sizing: border-box; width: var(--ew); aspect-ratio: auto; min-height: calc(var(--ew) * .86); margin-top: 70px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3.4cqw;
    padding: calc(var(--ew) * .085) calc(var(--ew) * .02) calc(var(--ew) * .03); border: solid transparent; border-width: calc(var(--ew) * .123) calc(var(--ew) * .168) calc(var(--ew) * .126); background: none;
    border-image: url(art/ui/popup-panel.webp) 501 179 219 fill / calc(var(--ew) * .456) calc(var(--ew) * .163) calc(var(--ew) * .199) stretch; filter: drop-shadow(0 10px 14px #0008); }
  .evcard > * { position: static; }
  .evcard .evstar { position: absolute; top: -33cqw; width: 30cqw; }
  .evcard .evhead { display: grid; place-items: center; height: auto; }

<body>
<script>
// ---- Studio splash ----
// The Strategic Sloth splash, shown first thing, over the loading screen, while the game's pictures load behind it.
// Tap or press a key to skip; add ?nosplash to the address to leave it out. The same code is in Tropic Tumble: change both together.
(function () {
  const CSS = `
.ss-root { position:fixed; inset:0; z-index:99999; display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:#f6f5ef; color:#252b23; overflow:hidden; user-select:none; -webkit-user-select:none; touch-action:none;
  --s:min(62vw,36vh,340px); transition:opacity .35s ease; }
.ss-root.ss-out { opacity:0; }
.ss-root::before { content:''; position:absolute; left:50%; top:46%; width:calc(var(--s)*2.6); height:calc(var(--s)*2.6); margin:calc(var(--s)*-1.3);
  border-radius:50%; background:radial-gradient(circle,rgba(198,242,122,.4),rgba(198,242,122,0) 62%); opacity:0; }
.ss-peek { position:relative; width:var(--s); height:calc(var(--s)*.675); overflow:hidden; }
.ss-sloth { position:absolute; left:0; top:calc(var(--s)*-.12); width:var(--s); height:var(--s); transform:translateY(82%); }
.ss-sloth img { display:block; width:100%; height:100%; }
.ss-lens { position:absolute; top:33.5%; width:20.5%; height:14.5%; border-radius:46% 46% 50% 50%; overflow:hidden; }
.ss-lens.l { left:26.5%; } .ss-lens.r { left:54%; }
.ss-lens i { position:absolute; top:-20%; left:0; width:38%; height:140%; background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);
  transform:translateX(-160%) skewX(-24deg); }
.ss-ledge { width:calc(var(--s)*1.25); height:4px; margin-top:-2px; border-radius:4px; background:#252b23; transform:scaleX(0); }
.ss-name { margin-top:calc(var(--s)*.11); font-size:calc(var(--s)*.135); font-weight:700; letter-spacing:-.03em; line-height:1; white-space:nowrap; }
.ss-name span { display:inline-block; white-space:pre; opacity:0; transform:translateY(.7em); }
.ss-name .ss-star { color:#45633e; margin-left:.22em; transform:scale(0) rotate(-180deg); }
.ss-sub { margin-top:calc(var(--s)*.05); font:500 calc(var(--s)*.042)/1 ui-monospace,Menlo,Consolas,monospace; letter-spacing:.32em; text-indent:.32em;
  text-transform:uppercase; color:#62685d; opacity:0; }

.ss-go::before { animation:ss-fade .9s .5s ease-out forwards; }
.ss-go .ss-ledge { animation:ss-line .45s cubic-bezier(.2,.8,.2,1) forwards; }
.ss-go .ss-sloth { animation:ss-rise .95s .25s cubic-bezier(.25,1.25,.4,1) forwards; }
.ss-go .ss-lens i { animation:ss-glint .55s 1.25s ease-in-out forwards; }
.ss-go .ss-lens.r i { animation-delay:1.33s; }
.ss-go .ss-name span { animation:ss-up .45s calc(1.05s + var(--i)*.028s) cubic-bezier(.2,.9,.3,1) forwards; }
.ss-go .ss-name .ss-star { animation:ss-star .55s 1.6s cubic-bezier(.3,1.5,.5,1) forwards; }
.ss-go .ss-sub { animation:ss-fade .4s 1.8s ease-out forwards; }

@keyframes ss-line { to { transform:scaleX(1); } }
@keyframes ss-rise { to { transform:translateY(0); } }
@keyframes ss-glint { to { transform:translateX(420%) skewX(-24deg); } }
@keyframes ss-up { to { opacity:1; transform:none; } }
@keyframes ss-star { to { opacity:1; transform:none; } }
@keyframes ss-fade { to { opacity:1; } }

@media (prefers-reduced-motion:reduce) {
  .ss-go::before, .ss-go .ss-ledge, .ss-go .ss-sloth, .ss-go .ss-name span, .ss-go .ss-name .ss-star, .ss-go .ss-sub { animation-duration:.01s; animation-delay:0s; }
  .ss-go .ss-lens i { animation:none; }
}`;

  const LANDED = 2.2; // seconds until the last piece has settled

  function play(opts) {
    const o = Object.assign({ logo: 'sloth-logo.png', font: "'Manrope','Fredoka',system-ui,'Segoe UI',Roboto,sans-serif", hold: .7, parent: document.body }, opts);
    return new Promise(resolve => {
      if (!document.getElementById('ss-style')) {
        const st = document.createElement('style'); st.id = 'ss-style'; st.textContent = CSS; document.head.append(st);
      }
      const letters = [...'strategic sloth'].map((c, i) => `<span style="--i:${i}">${c}</span>`).join('');
      const root = document.createElement('div');
      root.className = 'ss-root';
      root.setAttribute('role', 'img');
      root.setAttribute('aria-label', 'Strategic Sloth presents');
      root.innerHTML = `<div class="ss-peek"><div class="ss-sloth"><img alt="" draggable="false"><b class="ss-lens l"><i></i></b><b class="ss-lens r"><i></i></b></div></div>
<div class="ss-ledge"></div><div class="ss-name" style="font-family:${o.font}">${letters}<span class="ss-star">✳</span></div><div class="ss-sub">presents</div>`;
      o.parent.append(root);

      let timer, done = false;
      const finish = () => {
        if (done) return; done = true;
        clearTimeout(timer); removeEventListener('keydown', finish);
        root.classList.add('ss-out');
        setTimeout(() => { root.remove(); resolve(); }, 360);
      };
      const start = () => {
        if (done || root.classList.contains('ss-go')) return;
        root.classList.add('ss-go');
        timer = setTimeout(finish, (LANDED + o.hold) * 1000);
      };
      root.addEventListener('pointerdown', finish);
      addEventListener('keydown', finish);

      // hold the animation until the logo has loaded so the sloth never rises in blank
      const img = root.querySelector('img');
      img.onload = img.onerror = start;
      img.src = o.logo;
      setTimeout(start, 1200);
    });
  }

  window.StrategicSlothSplash = { play };
})();
const slothSplash = /[?&]nosplash\b/.test(location.search) ? Promise.resolve()
  : StrategicSlothSplash.play({ logo: 'art/ui/sloth-logo.webp', font: 'Fredoka,system-ui,sans-serif', hold: .4 });
</script>

  rush:   { img: 'art/lettering/call-rush.webp',   energy: 5 },  // 5 matches in 10 seconds

// ---- Player profile: name, avatar, frame and progress to the next level ----

const partyBody = (html) => { $('partyBody').innerHTML = html; };

// A reward card. Pressing Get pays it: the prizes fly up to the counters, which count up as they land.

  partyBody(`<div class="evcard"><div class="evstar" aria-hidden="true"><i class="rays"></i><i class="glow"></i><i class="star"></i></div>${signTitle(title)}<div class="psub">REWARD</div>${cells}

function chest() {

    setTimeout(() => { el.classList.replace('f1', 'f2'); burst(...mid(), 26); confetti(50, $('party')); SND.chest(); buzz([25, 40, 25]); }, 440);   // and it bursts open

// The finished painting stays on show behind a Play button. Pressing it opens the next scene, empty, and goes back to the game.

// ---- Reminders ----
// Two local notifications, set by the phone itself when the player leaves (no server): "energy is full" for the moment it
// refills, and "event ends soon" a few hours before a running event's deadline. Both are withdrawn when the player returns.
// The player is asked once, after a first finished scene, and can change the answer in Settings.
const NOTE_ENERGY = 101, NOTE_EVENT = 102, NOTE_MIN_MS = 5 * 60e3;
const notesOn = () => !!native?.Notify && state.notes === 1;
function scheduleNotes() {
  if (!notesOn()) return;
  const now = Date.now(), list = [];
  const fullIn = state.energy < MAX_ENERGY ? (MAX_ENERGY - state.energy) * REGEN_MS - (now - state.energyTs) : 0;
  if (fullIn >= NOTE_MIN_MS) list.push({ id: NOTE_ENERGY, title: 'Energy is full!', body: 'Your stickers are waiting. Come back to the fjord.', schedule: { at: new Date(now + fullIn), allowWhileIdle: true } });
  const ev = state.ev;
  if (ev && ev.ends > now && EVENTS[ev.id].stickers.some((n) => !ev.placed[n])) {
    const lead = ev.ends - now > 4 * 36e5 ? 3 * 36e5 : ev.ends - now > 60 * 60e3 ? 30 * 60e3 : 0, left = EVENTS[ev.id].stickers.filter((n) => !ev.placed[n]).length;
    if (lead) list.push({ id: NOTE_EVENT, title: `${EVENTS[ev.id].name} ends soon`, body: `${left} sticker${left > 1 ? 's' : ''} to go. Finish the scene for the reward!`, schedule: { at: new Date(ev.ends - lead), allowWhileIdle: true } });
  }
  native.Notify.cancel({ notifications: [{ id: NOTE_ENERGY }, { id: NOTE_EVENT }] }).catch(() => {}).then(() => list.length && native.Notify.schedule({ notifications: list })).catch(() => {});
}
function clearNotes() { native?.Notify?.cancel({ notifications: [{ id: NOTE_ENERGY }, { id: NOTE_EVENT }] }).catch(() => {}); }
document.addEventListener('visibilitychange', () => (document.hidden ? scheduleNotes() : clearNotes()));
// The game's own question comes first, so the system's one-time permission box is only spent on a player who has said yes.

    closeModal();
    if (act !== 'yes') { state.notes = 0; save(); return then(); }
    let ok = false; try { ok = (await native.Notify.requestPermissions()).display === 'granted'; } catch {}
    state.notes = ok ? 1 : 0; save(); track('notes', { ok }); if (ok) toast('Reminders are on', BLANK); then();
  });
}

    <button data-act="rate" ${n ? '' : 'disabled style="opacity:.5"'}>Rate</button><button data-act="close" class="alt">Not now</button>`, (act) => {

// ---- Actions ----
function spawn(c) {

  // Whatever finishes a set: the rest of a part-made set of this pack if there is one, otherwise a whole new set of eight.
  // Dealing less would leave a sticker on the pile with no twin to match.
  const part = partKinds(c), k = part.length ? pick(part) : freshKind(c), n = missing(c, k) || SET;

  if (state.energy < 1) return toast('Out of energy', 'art/lettering/toast-out-of-energy.webp');
  state.energy--;
  const nb = dropIn(c, k, 0);
  for (let i = 1; i < n; i++) dropIn(c, k, 0, i * 0.3);
  SND.drop();

// Nearest identical sticker close enough to the held one to merge with.
function mergeTarget(a) {

    const d = Math.hypot(b.x - a.x, b.y - a.y);
    if (d < bestD) { bestD = d; best = b; }

}

function merge(a, b) {

  }

    removeBody(a); removeBody(b); setTier(up, true);
    state.matches++; onMatch(c);
    if (up.t === 1 && once('tier1')) queueTip('Two stone carvings make a painted sticker. Merge two painted ones next!', 5000);
    if (up.t === 2 && once('tier2')) queueTip('Shiny! Match two shiny stickers to collect them', 5000);

function flyToPack(b) {

    { duration: 380, easing: 'ease-in' });

function win() {
  if ($('win').classList.contains('open')) return;

  const perMatch = state.matches ? state.score / state.matches : 0, stars = perMatch >= 500 ? 3 : perMatch >= 300 ? 2 : 1;

  const b = drag.b, dragged = Math.hypot(b.x - drag.x0, b.y - drag.y0) > R * 0.5;
  const t = e.type === 'pointerup' && dragged ? mergeTarget(b) : null;
  els.get(b.id)?.classList.remove('held');
  drag = null;
  try { pile.releasePointerCapture(e.pointerId); } catch {}
  if (t) return merge(b, t);
  // Dropped on a different sticker: a little "nope" wobble before it falls back into the pile.
  if (e.type === 'pointerup' && dragged && bodies.some((o) => o !== b && Math.hypot(o.x - b.x, o.y - b.y) < R * 1.5)) {
    fx(els.get(b.id), 'shake'); onMiss(); SND.nope();
    // Same design but a different stage: say why it did not match, instead of only shaking.
    const twin = bodies.find((o) => o !== b && !o.ice && o.c === b.c && o.k === b.k && o.t !== b.t && Math.hypot(o.x - b.x, o.y - b.y) < R * 2.2);
    if (twin) toast(`One is ${TIER_WORD[Math.min(b.t, twin.t)]}, one is ${TIER_WORD[Math.max(b.t, twin.t)]}. Match two alike`, BLANK);
  }
  save();
}
pile.addEventListener('pointerup', endDrag);
pile.addEventListener('pointercancel', endDrag);

function energyAd() {
  if (state.energy >= MAX_ENERGY) return toast('Energy is full!', 'art/lettering/toast-energy-full.webp');
  ads.rewarded().then((ok) => {
    if (!ok) return;
    gainEnergy(AD_ENERGY); tickEnergy(); save(); SND.bonus(); toast('+25 energy', 'art/lettering/toast-energy-25.webp');
  });
}
// + buttons: energy stands in for a rewarded ad, gems for the shop.
$('stats').addEventListener('click', (e) => {
  // The whole bar is the button: it squashes under the finger, bounces back and throws a few sparkles from its +.
  const bar = e.target.closest('.bar');
  if (!bar) return;
  const k = bar.id === 'energyBar' ? 'energy' : 'gems', plus = bar.querySelector('button').getBoundingClientRect();
  fx(bar, 'boing', 450); burst(plus.left + plus.width / 2, plus.top + plus.height / 2, 5);
  if (k === 'energy') energyAd();
  if (k === 'gems') openShop();
});

// ---- Cheats ----
function setMenu(open) { $('cheats').classList.toggle('open', open); $('gear').classList.toggle('on', open); }
$('gear').onclick = () => setMenu(!$('cheats').classList.contains('open'));
document.addEventListener('pointerdown', (e) => {
  if ($('cheats').classList.contains('open') && !e.target.closest('#cheats, #gear')) setMenu(false);
}, true);
$('cheats').addEventListener('click', (e) => {
  const k = e.target.closest('[data-cheat]')?.dataset.cheat;
  if (!k) return;
  setMenu(false);
  if (k === 'energy') gainEnergy(50);
  if (k === 'fill') { ending = true; clearBodies(); return win(); }
  if (k === 'reset') { state = fresh(); closeModal(); return startLevel(); }
  const quieter = (v) => v > 0.8 ? 0.6 : v > 0.4 ? 0.3 : v > 0 ? 0 : 1;      // 100% -> 60% -> 30% -> off -> 100%
  if (k === 'sound') { state.sfxVol = quieter(state.sfxVol); if (ac) sfxOut.gain.value = 0.9 * state.sfxVol; renderSound(); SND.click(); setMenu(true); }
  if (k === 'music') {
    state.musVol = quieter(state.musVol); renderSound(); setMenu(true);
    if (!state.musVol) stopMusic(); else if (musicTimer) musicOut.gain.setTargetAtTime(0.8 * state.musVol, ac.currentTime, 0.2); else startMusic();
  }
  if (k === 'help') return openHelp();
  if (k === 'notes') return toggleNotes().then(renderSound);
  renderHud(); save();
});

function renderSound() {
  const pct = (v) => v ? Math.round(v * 100) + '%' : 'off';
  const mi = (src, on) => `<img class="mi${on ? '' : ' off'}" src="${src}" alt="">`;   // a row's picture, greyed while the thing is switched off
  $('soundRow').innerHTML = mi('art/ui/set-icon-sound.webp', state.sfxVol) + 'Sound: ' + pct(state.sfxVol);
  $('musicRow').innerHTML = mi('art/ui/set-icon-music.webp', state.musVol) + 'Music: ' + pct(state.musVol);
  $('notesRow').innerHTML = mi('art/ui/set-icon-reminders.webp', state.notes === 1) + 'Reminders: ' + (state.notes === 1 ? 'on' : 'off');
}

// ---- Boot ----
// In the app: bring the save back if the phone cleared web storage, and make Android's back button pause or close what is open.
if (native?.Preferences && !localStorage.getItem(SAVE_KEY)) {
  native.Preferences.get({ key: SAVE_KEY }).then((r) => { if (r?.value) { try { localStorage.setItem(SAVE_KEY, r.value); location.reload(); } catch {} } }).catch(() => {});
}
native?.App?.addListener('backButton', () => {
  if ($('ad').classList.contains('open')) return;
  if ($('cheats').classList.contains('open')) setMenu(false);
  else if ($('modal').classList.contains('open')) closeModal();
  else if ($('party').classList.contains('open')) return;
  else if ($('scene').classList.contains('open')) closeScene();
  else if ($('coll').classList.contains('open')) closeColl();
  else if ($('map').classList.contains('open')) closeMap();
  else if (!$('win').classList.contains('open')) openPause();
});
renderHud();                         // tray first, so the pile is measured at its real height
measure();
new ResizeObserver(measure).observe(pile);
// Reopened on a finished level (closed before tapping Next): go straight back to the completed screen, rewards already paid.
const finished = !!state.done;
$('app').classList.toggle('debug', DEBUG); setWorld(state.page);
renderTools(); renderSound(); pile.classList.toggle('tide', TIDE_S > 0);
if (finished) { renderWin(state.stars[state.page] || 1, 0, true); $('win').classList.add('open'); }
else if (state.bodies?.length) { state.bodies.filter((b) => PACKS[b.c]?.e[b.k]).forEach((b) => addBody(b.c, b.k, b.t, b.x, b.y, b.rot, b.ice)); if (tidyPile()) save(); tutorial(); }
else startLevel();
setInterval(() => {
  tickEnergy(); save();
  // safety net: if the goal is already met and nothing is on top of the game, finish the level
  if (bodies.length && !$('win').classList.contains('open') && !$('modal').classList.contains('open') && !$('ad').classList.contains('open')) checkGoal();
}, 1000);

// Preload every image behind the loading screen (a failed one still counts, so loading can never hang),
// keep the screen up for at least a moment, then start the pile.
const stickerArt = (c) => [PACKS[c].icon, ...PACKS[c].e.flatMap((n) => TIER_ART.map((t) => stickerSrc(n, t)))];
const ASSETS = ['art/paintings/background.webp', 'art/ui/panel.webp', 'art/icons/fox.webp', 'art/ui/sign.webp', 'art/ui/gems.webp', 'art/ui/energy.webp', 'art/ui/pass-board.webp', 'art/shop/scroll.webp',
  'art/icons/tool-hint.webp', 'art/icons/tool-shuffle.webp', 'art/icons/tool-magnet.webp', 'art/icons/tool-album.webp', 'art/ui/home-btn.webp', 'art/icons/star.webp', 'art/icons/rating-star.webp', 'art/icons/gem.webp', 'art/ui/popup-frame.webp', 'art/lettering/call-idle.webp',
  `art/paintings/world-${worldOf(state.page)}.webp`, 'art/lettering/play-button.webp', 'art/lettering/play-word.webp', 'art/paintings/hub-bg.webp', 'art/ui/nav-bar.webp', 'art/ui/nav-plank.webp', 'art/ui/nav-on.webp', 'art/ui/nav-stories.webp', 'art/ui/nav-home.webp', 'art/lettering/logo-board.webp', 'art/paintings/hub-sand.webp', 'art/ui/home-button.webp', 'art/ui/scene-frame.webp', 'art/ui/scene-frame-on.webp', 'art/ui/scene-count.webp',
  ...levelPacks().flatMap(stickerArt)];
// The rest: reward screens, messages, the map, and the stickers of sets not in this level. Fetched a few at a time once the game
// is running, so the first use of each is instant, without holding up the start.
const LATER = ['art/icons/check.webp', 'art/paintings/map.webp', 'art/ui/pause-frame.webp', 'art/ui/pause-title.webp', 'art/ui/pause-resume.webp', 'art/ui/pause-restart.webp', 'art/ui/pause-levels.webp', 'art/ui/pause-profile.webp', 'art/ui/pause-help.webp', 'art/ui/set-frame.webp', 'art/ui/set-row.webp', 'art/lettering/toast-energy-full.webp', 'art/lettering/toast-energy-25.webp', 'art/lettering/toast-no-space.webp', 'art/lettering/toast-out-of-energy.webp', 'art/lettering/toast-no-energy.webp', 'art/lettering/toast-no-gems.webp', 'art/lettering/toast-wave.webp', 'art/lettering/toast-frozen.webp', 'art/lettering/toast-no-pair.webp', 'art/lettering/toast-gift.webp', 'art/lettering/toast-reward-claimed.webp', 'art/lettering/tip-drag.webp',
  'art/ui/popup-panel.webp', 'art/ui/win-post-l.webp', 'art/ui/win-post-r.webp', 'art/ui/win-cell-gem.webp', 'art/ui/win-cell-energy.webp', 'art/ui/win-btn-green.webp', 'art/ui/win-plank.webp', 'art/ui/win-cell-blank.webp', 'art/ui/scene-head.webp', 'art/ui/scene-head-blank.webp', 'art/ui/scene-body.webp', 'art/ui/scene-reward.webp', 'art/ui/scene-ad.webp', 'art/ui/pop-cone.webp', 'art/ui/pop-burst.webp', 'art/ui/pop-pink.webp', 'art/ui/pop-blue.webp', 'art/ui/pop-stars.webp', ...Object.values(BONUSES).map((b) => b.img),
  'art/ui/map-stars.webp', 'art/ui/map-chest-bar.webp', 'art/ui/map-node.webp', 'art/ui/map-star.webp', 'art/ui/map-crown.webp', 'art/ui/map-lock.webp', 'art/ui/map-banner.webp', 'art/lettering/map-logo.webp', 'art/ui/map-back.webp', 'art/ui/map-chest.webp', 'art/ui/scene-hud.webp', 'art/ui/bar-blue.webp', 'art/ui/bar-gold.webp', 'art/ui/bar-wood.webp', 'art/ui/bar-red.webp', 'art/ui/guide-card.webp', 'art/lettering/level-complete.webp', sceneBg(state.sceneIdx % SCENE_NAMES.length),
  ...PACKS.flatMap((_, c) => levelPacks().includes(c) ? [] : stickerArt(c))].filter((f) => !ASSETS.includes(f));
// Fetches the rest one picture at a time, and only in quiet moments: never while a sticker is being dragged or the pile is
// still tumbling, so the background work cannot make play stutter. (Fetching three at a time straight after start-up did:
// the first seconds of a first install were sluggish until the queue ran dry.)
const busyPile = () => !covered() && !$('win').classList.contains('open') && (!!drag || bodies.some((b) => Math.hypot(b.x - b.px, b.y - b.py) > 0.6));
function loadLater(i = 0) {
  if (i >= LATER.length) return;
  if (busyPile()) return void setTimeout(() => loadLater(i), 600);
  const img = new Image(), next = () => setTimeout(() => loadLater(i + 1), 180);
  img.onload = () => { if (LATER[i] === 'art/paintings/map.webp') mapReady = true; next(); }; img.onerror = next; img.src = LATER[i];
}
const MIN_LOAD_MS = 1500, bootAt = performance.now();
let loaded = 0;
function assetDone() {
  loaded++;
  $('loadFill').style.width = loaded / ASSETS.length * 100 + '%';
  if (loaded < ASSETS.length) return;
  // wait for the studio splash to clear, then give the game's own loading painting a moment before the pile starts
  slothSplash.then(() => setTimeout(() => {
    $('loading').classList.add('done');
    setTimeout(() => $('loading').remove(), 500);
    last = startedAt = performance.now(); requestAnimationFrame(frame); setTimeout(loadLater, 6000);
    if (state.tut > 0 && !finished) openColl();   // returning players start at the hub; a first-time player goes straight into level 1
    setTimeout(daily, 900);
  }, Math.max(500, MIN_LOAD_MS - (performance.now() - bootAt))));
}
const KEEP = [];                     // held so the decoded pictures are not thrown away again
// A picture counts once it is decoded. A browser puts decoding off while the page is hidden, so a picture that has arrived also counts
// a moment later, decoded or not: the loading screen can never wait for ever on a page that started in the background.
for (const src of ASSETS) {
  const img = new Image(); let counted = false; const done = () => { if (!counted) { counted = true; assetDone(); } };
  KEEP.push(img); img.onload = () => setTimeout(done, 1200); img.onerror = done; img.src = src;
  if (img.decode) img.decode().then(done, () => {});
}
</script>
