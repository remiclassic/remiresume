<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#d89762">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Runefjord</title>
<style>
  @font-face { font-family: Fredoka; font-weight: 700; src: url(fredoka-700.woff2) format('woff2'); font-display: swap; }   /* the studio splash wordmark */
  @font-face { font-family: Cinzel; font-weight: 700; src: url(cinzel-700.woff2) format('woff2'); font-display: swap; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: none; }
  button { font-family: inherit; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f8ece3; font-family: Cinzel, system-ui, sans-serif;
    user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
  #app { height: calc(100dvh - env(safe-area-inset-top)); max-width: 480px; margin: env(safe-area-inset-top) auto 0; display: flex; flex-direction: column; background: #f7dfae url(art/paintings/background.webp) center / cover no-repeat; position: relative; }

  #hud { display: flex; align-items: flex-start; justify-content: space-between; padding: 8px 10px 4px; position: relative; min-height: 88px; z-index: 6; }
  /* Hanging sign: ropes run off the top edge, page name sits on the plaque. */
  #sign { position: absolute; left: 50%; top: 0; width: 46%; aspect-ratio: 1774 / 887; transform: translateX(-50%);   /* the hanging board: level name on the big plank, score on the small plaque under it */
    background: url(art/ui/sign.webp) center / 100% 100% no-repeat; pointer-events: none; }
  /* Gem and energy bars: art is one image each; the number, timer and + button are laid over its slots in %. */
  #stats { width: 26.5%; display: flex; flex-direction: column; gap: 2px; }
  .bar { position: relative; container-type: inline-size; background: center / 100% 100% no-repeat; font-weight: 800; }
  .bar span { position: absolute; display: flex; align-items: center; justify-content: center; white-space: nowrap; }
  .bar button { position: absolute; border: 0; padding: 0; background: none; border-radius: 50%; }
  .bar button:active { background: #ffffff66; }
  #gemsBar { aspect-ratio: 480 / 143; background-image: url(art/ui/gems.webp); color: #f6e7c4; }
  #gems { left: 29%; width: 45%; top: 17.5%; height: 66%; font-size: 15cqw; }
  #gemsBar button { left: 78.7%; width: 17.3%; top: 18.3%; height: 58%; }
  #energyBar { aspect-ratio: 480 / 207; background-image: url(art/ui/energy.webp); color: #3a1d08; }
  #energy { left: 27%; width: 49%; top: 18.3%; height: 42.5%; font-size: 15cqw; }
  #regen { left: 39%; width: 39.6%; top: 67.3%; height: 24%; font-size: 9.5cqw; color: #f6e7c4; }
  #energyBar button { left: 78.6%; width: 18%; top: 19.1%; height: 41.7%; }
  /* Settings and pause: two iron buttons. */
  #gear, #pauseBtn { width: 42px; height: 42px; border: 0; border-radius: 50%; padding: 0; background: center / contain no-repeat; filter: drop-shadow(0 2px 3px #0008); }
  #gear { background-image: url(art/ui/btn-gear.webp); }
  #pauseBtn { background-image: url(art/ui/btn-pause.webp); }
  #gear svg, #pauseBtn svg { display: none; }
  .pill { background: #ffffffd9; border-radius: 999px; padding: 4px 10px; font-weight: 700; color: #3a2410; font-size: 14px; }
  #pageName { position: absolute; left: 0; right: 0; top: 46%; transform: translateY(-50%); text-align: center; font-weight: 800; color: #f6e7c4; -webkit-text-stroke: 1.5px #2a1608; paint-order: stroke fill;
    font-size: 15px; }

  /* Settings menu: a painted frame (art/ui/set-frame.webp, 760 x 1350) of carved knotwork posts with wolf heads, banners, torches and round shields.
     It is 9-sliced: the top slice holds everything down to the shields and the bottom slice the brackets, banners and fur, so those keep their shape and
     only the plain knotwork between them stretches with the number of rows. The frame is see-through inside, so dark planks are drawn behind the rows.
     Each row is a parchment plate (art/ui/set-row.webp) with its arrow painted in and a round medallion (art/ui/set-icon-*.webp) at its left end.
     --mw is the menu's width; every size here is a share of it. */
  #cheats { --mw: min(94vw, 451px); display: none; position: absolute; top: 40px; left: calc((100% - var(--mw)) / 2); box-sizing: border-box; width: var(--mw); min-height: calc(var(--mw) * 1.214); z-index: 20;
    flex-direction: column; justify-content: center; gap: calc(var(--mw) * .02); padding: calc(var(--mw) * .212) calc(var(--mw) * .15) calc(var(--mw) * .357);
    background: repeating-linear-gradient(#0000 0 calc(var(--mw) * .158), #0007 calc(var(--mw) * .158) calc(var(--mw) * .162)), linear-gradient(90deg, #2c1d14, #3a281b 50%, #2c1d14); background-repeat: no-repeat;
    background-position: calc(var(--mw) * .12) calc(var(--mw) * .15); background-size: calc(100% - var(--mw) * .24) calc(100% - var(--mw) * .45);
    filter: drop-shadow(0 6px 10px #0008); }
  #cheats::before { content: ''; position: absolute; inset: 0; pointer-events: none; border: solid transparent; border-width: calc(var(--mw) * .7224) calc(var(--mw) * .1395) calc(var(--mw) * .4908);
    border-image: url(art/ui/set-frame.webp) 549 106 373 / calc(var(--mw) * .7224) calc(var(--mw) * .1395) calc(var(--mw) * .4908) stretch; }
  #cheats.open { display: flex; }
  #cheats button { position: relative; z-index: 1; display: flex; align-items: center; box-sizing: border-box; width: 100%; height: calc(var(--mw) * .142); margin: 0; padding: 0 calc(var(--mw) * .085) 0 calc(var(--mw) * .012); border: 0;
    background: url(art/ui/set-row.webp) center / 100% 100% no-repeat; filter: drop-shadow(0 2px 2px #0008);
    font: 700 calc(var(--mw) * .04)/1 Cinzel, system-ui, sans-serif; color: #2a1608; text-align: left; white-space: nowrap; }
  #cheats button[data-cheat="reset"] { color: #a01c12; }
  #cheats .mi { flex: none; width: calc(var(--mw) * .128); height: calc(var(--mw) * .128); margin-right: calc(var(--mw) * .03); object-fit: contain; filter: drop-shadow(0 1px 1px #0006); pointer-events: none; }
  #cheats .mi.off { filter: grayscale(1) brightness(.8); }
  #cheats button:active { filter: drop-shadow(0 2px 2px #0008) brightness(1.15); transform: scale(.97); }

  /* The pile: every sticker is a loose body that falls and stacks. */
  #pile { flex: 1; position: relative; min-height: 0; clip-path: inset(-400px 0 -40px 0); }  /* no clipping at the floor line or the top; only the side walls clip */
  .st { position: absolute; left: 0; top: 0; width: var(--d); height: var(--d); margin: calc(var(--d) / -2) 0 0 calc(var(--d) / -2);
    font-size: calc(var(--d) * .8); line-height: var(--d); text-align: center; pointer-events: none; will-change: transform; }
  .st { filter: drop-shadow(0 2px 2px #0006); }
  .st.t2 { filter: none; }             /* its shadow is drawn with its white edge, in one pass */
  /* A shiny (finished) sticker wears a white sticker edge and a twinkle, so it cannot be mistaken for the painted stage below it. */
  .st.t2 > span { filter: drop-shadow(0 0 1.2px #fff) drop-shadow(0 0 1.2px #fff) drop-shadow(0 2px 2px #0006); }
  .st.t2::before { content: ''; position: absolute; right: -4%; top: -6%; width: 34%; aspect-ratio: 1; z-index: 2; background: radial-gradient(#fff 30%, #fff6b0 60%, #ffd84a);
    clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); filter: drop-shadow(0 0 2px #fff8); animation: shinyTwk 1.4s ease-in-out infinite alternate; }
  @keyframes shinyTwk { 0% { transform: scale(.55) rotate(-12deg); opacity: .7; } 100% { transform: scale(1.05) rotate(12deg); opacity: 1; } }
  /* Lighter look for slow phones: no per-sticker shadows, no ambient twinkles or turning rays, fewer particles (see confetti and burst). */
  .lite .st { filter: none; }
  .lite .st.t2 > span { filter: drop-shadow(0 0 1.5px #fff); }
  .lite .st.t2::before, .lite .caustic, .lite .glint, .lite .tw, .lite .twk { display: none; }
  .lite .rays, .lite .glow, .lite .pglow::before, .lite .pglow::after, .lite .popper .spray { animation: none !important; }
  .lite .popper .spray { opacity: 1; }
  /* Guided introduction: the screen dims, one thing is left lit, and the fox says one sentence about it. */
  #guide { position: absolute; inset: 0; z-index: 56; overflow: hidden; }
  #guide[hidden] { display: none; }
  #guideSpot { position: absolute; border-radius: 18px; box-shadow: 0 0 0 3px #fff, 0 0 0 7px #ffd84a, 0 0 22px 8px #ffe97acc, 0 0 0 2000px #422813b8; pointer-events: none; transition: left .3s, top .3s, width .3s, height .3s; animation: guidePulse 1.1s ease-in-out infinite alternate; }
  @keyframes guidePulse { to { box-shadow: 0 0 0 3px #fff, 0 0 0 9px #ffd84a, 0 0 30px 12px #ffe97acc, 0 0 0 2000px #422813b8; } }
  #guideCard { position: absolute; left: 14px; right: 14px; padding: 14px 14px 12px 96px; min-height: 104px; border-radius: 22px; border: 5px solid #d8c08a; background: #fdf3e3; box-shadow: 0 0 0 3px #9a6a30, inset 0 0 0 2px #fff, 0 8px 18px #0007; transition: top .3s; animation: winIn .35s cubic-bezier(.2, 1.5, .4, 1); }
  #guideCard .gfox { position: absolute; left: -12px; bottom: -10px; width: 104px; aspect-ratio: 274 / 300; background: url(art/icons/fox-guide.webp) center / contain no-repeat; filter: drop-shadow(0 3px 3px #0004); animation: foxWave 1.2s ease-in-out infinite alternate; transform-origin: 50% 100%; }
  @keyframes foxWave { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
  #guideText { margin: 0 0 10px; color: #2a1a10; font: 600 16px/1.3 Cinzel, system-ui, sans-serif; }
  #guideText b { color: #7a4a16; }
  #guideCard .grow { display: flex; align-items: center; gap: 10px; }
  #guideDots { flex: 1; display: flex; gap: 5px; justify-content: center; }
  #guideDots i { width: 8px; height: 8px; border-radius: 50%; background: #e4d3ac; }
  #guideDots i.on { background: #c98a2b; }
  #guideSkip { border: 0; padding: 6px 4px; background: none; color: #6a86a6; font: 600 14px/1 Cinzel, system-ui, sans-serif; text-decoration: underline; }
  #guideNext { padding: 9px 22px; border-radius: 99px; border: 3px solid #7a4a12; background: linear-gradient(#f2c869, #d99a34 60%, #c98a2b); box-shadow: inset 0 3px 0 #ffe9a8, inset 0 -4px 0 #a86a1c, 0 3px 5px #0004; color: #fff; font: 700 17px/1 Cinzel, system-ui, sans-serif; -webkit-text-stroke: 2px #7a4a12; paint-order: stroke fill; }
  #guideNext:active { transform: scale(.94); }
  .st.held { z-index: 10; }
  .st > span { display: block; width: 100%; height: 100%; background: center / contain no-repeat; }
  .st.pop > span { animation: pop .35s ease-out; }
  .st.held > span { transform: scale(1.2); }
  @keyframes pop { 0% { transform: scale(1.8); } }
  .fly { position: fixed; z-index: 30; pointer-events: none; transform: translate(-50%, -50%); background: center / contain no-repeat; }

  /* Pack panel: the art is one image; buttons, counters and the progress bar are laid over its slots in %. */
  #tray { position: relative; flex: none; margin: 12px 8px calc(8px + env(safe-area-inset-bottom));  /* the pile's floor sits a gap above the fox's ears, so no sticker goes behind the panel */
    aspect-ratio: 2000 / 935; background: url(art/ui/panel.webp) center bottom / 100% auto no-repeat;   /* the painted frame (2000 x 731) sits on the bottom of this box; the space above it is for the wolf and the Home button */
    container-type: inline-size; z-index: 5; }
  .pack { position: absolute; top: 50.4%; height: 36.2%; width: 18.9%; border: 0; padding: 0; background: none; border-radius: 12% / 14%; }
  .pack span.e { position: absolute; left: 8%; right: 8%; top: 3%; height: 72%; background: center / contain no-repeat; }
  .pack span.n { position: absolute; left: 0; right: 0; top: 75%; height: 20%; display: flex; align-items: center; justify-content: center;
    font-size: 3.4cqw; font-weight: 800; color: #3b3350; }
  .pack span.n::before { content: ''; position: absolute; z-index: -1; left: 13%; right: 13%; top: 6%; bottom: 6%; border-radius: 99px; background: color-mix(in srgb, var(--set) 42%, #fff); box-shadow: inset 0 -2px 0 color-mix(in srgb, var(--set) 70%, #fff); }
  img.tick { height: 1.5em; margin: -.4em 0 -.35em .15em; vertical-align: middle; }   /* the painted tick, set in a line of words */
  .pack.done span.n::before { display: none; }
  .pack span.n { z-index: 0; }
  .pack:active { transform: scale(.94); }
  .pack.bump { animation: bump .3s ease-out; }
  .pack.done span.e { opacity: .35; }
  .pack.done span.n { top: 60%; height: 38%; }
  .pack.done span.n img { height: 100%; filter: drop-shadow(0 1px 1px #0004); }
  .pack.done.bump span.n img { animation: checkIn .4s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes checkIn { 0% { transform: scale(0) rotate(-40deg); } }
  #bar { position: absolute; left: 37.6%; top: 42.4%; width: 24.8%; height: 4.5%; border-radius: 99px; overflow: hidden; background: #1c120ccc; box-shadow: inset 0 1px 2px #000a; }   /* over the knotwork strip under the rune */
  #bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(#ffe45c, #ffb300); transition: width .3s; }
  /* How many sets are filled: a slate plate in a wood and iron frame, on the tray's top beam beside the arch. Its height follows from the art's shape. */
  #total { position: absolute; left: 70.5%; top: 28.6%; width: 27%; aspect-ratio: 300 / 107; padding: 0 0 .4% 0; display: flex; align-items: center; justify-content: center;
    background: url(art/ui/count-plate.webp) center / 100% 100% no-repeat; filter: drop-shadow(0 2px 3px #0008); font-size: 4.7cqw; font-weight: 800; letter-spacing: .04em; color: #f6e7c4; text-shadow: 0 1px 0 #000; }
  @keyframes bump { 0% { transform: scale(1.15); } }

  #toast { position: absolute; left: 50%; top: 42%; z-index: 60; transform: translateX(-50%); background: #3a2410ee; color: #fff; padding: 8px 14px;
    border-radius: 999px; font-size: 14px; font-weight: 600; opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; }   /* above Home, scenes and pop-ups, so a message is never hidden behind them */
  #toast.show { opacity: 1; }
  /* Art toast: the message is drawn in the image, so the text is hidden. */
  #toast.art { width: 90%; aspect-ratio: 1000 / 334; padding: 0; border-radius: 0; color: transparent;
    background: center / contain no-repeat; }
  #toast.art.claimed { aspect-ratio: 860 / 412; filter: drop-shadow(0 6px 8px #0008); }   /* the chest and its plank, with the words painted on */
  /* Level-complete screen. Each image has transparent padding, so background-size zooms to its artwork. */
  #win { display: none; position: absolute; inset: 0; z-index: 40; background: #4228139c;
    align-items: center; justify-content: center; }
  #win.open { display: flex; }
  #win { --ww: calc(min(100vw, 480px) * 1.16); }   /* the card is wider than the game's column, like every pop-up: its wolf heads and banners run off the sides */
  #winBox { position: relative; flex: none; width: var(--ww); animation: winIn .45s cubic-bezier(.2, 1.5, .4, 1); }
  #winBox .sparkles { display: none; position: absolute; left: 19%; bottom: calc(100% - 14px); width: 62%; aspect-ratio: 1; pointer-events: none;
    animation: none; }
  #winCard { position: relative; container-type: inline-size; display: flex; flex-direction: column; align-items: center; gap: 9px; justify-content: center; box-sizing: border-box; min-height: calc(var(--ww) * .9); padding: calc(var(--ww) * .1) calc(var(--ww) * .02) calc(var(--ww) * .03);
    border: solid transparent; border-width: calc(var(--ww) * .123) calc(var(--ww) * .168) calc(var(--ww) * .126);
    border-image: url(art/ui/popup-panel.webp) 501 179 219 fill / calc(var(--ww) * .456) calc(var(--ww) * .163) calc(var(--ww) * .199) stretch; filter: drop-shadow(0 12px 16px #0008); }   /* the same painted frame as the pop-ups: parchment in timber, wolf heads and rune banners */
  /* The party popper on top of the card: a glow and turning rays behind, the cone kicking, and paint and stars bursting out of it on a loop. */
  #winCard .popper { position: absolute; left: 50%; top: -31cqw; width: 46%; aspect-ratio: 1; margin-left: -23%; pointer-events: none; }
  .popper i { position: absolute; background: center / contain no-repeat; }
  .popper .rays { left: -75%; top: -62%; width: 250%; aspect-ratio: 1; border-radius: 50%; background: repeating-conic-gradient(#fff6a8cc 0 9deg, #fff6a800 9deg 20deg);
    -webkit-mask: radial-gradient(closest-side, #000 12%, #0008 38%, #0000 72%); mask: radial-gradient(closest-side, #000 12%, #0008 38%, #0000 72%); animation: spin 14s linear infinite; }
  .popper .glow { left: -30%; top: -18%; width: 160%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(closest-side, #fffbd6 0, #ffe97acc 30%, #ffd84a55 55%, #ffd84a00 78%); animation: popGlow 1.8s ease-in-out infinite alternate; }
  .popper .cone { left: 18%; top: 40%; width: 54%; aspect-ratio: 251 / 260; background-image: url(art/ui/pop-cone.webp); transform-origin: 30% 80%; animation: popKick 2.4s ease-out infinite; filter: drop-shadow(0 4px 4px #0004); }
  .popper .spray { animation: popSpray 2.4s cubic-bezier(.2, .9, .3, 1) infinite; opacity: 0; }
  .popper .burst { left: 40%; top: 2%; width: 62%; aspect-ratio: 320 / 317; background-image: url(art/ui/pop-burst.webp); transform-origin: 12% 88%; }
  .popper .pink { left: 54%; top: 16%; width: 48%; aspect-ratio: 240 / 193; background-image: url(art/ui/pop-pink.webp); transform-origin: 0 100%; animation-delay: .08s; }
  .popper .blue { left: 34%; top: -6%; width: 42%; aspect-ratio: 240 / 190; background-image: url(art/ui/pop-blue.webp); transform-origin: 55% 100%; animation-delay: .14s; }
  .popper .stars { left: 2%; top: 0; width: 36%; aspect-ratio: 234 / 240; background-image: url(art/ui/pop-stars.webp); transform-origin: 100% 100%; animation-delay: .2s; }
  .popper .stars.b { left: 78%; top: 44%; width: 26%; transform-origin: 0 50%; animation-delay: .28s; }
  @keyframes popKick { 0% { transform: rotate(0) scale(1); } 5% { transform: rotate(-9deg) scale(.86, 1.12); } 14% { transform: rotate(5deg) scale(1.08, .96); } 26%, 100% { transform: rotate(0) scale(1); } }
  @keyframes popSpray { 0% { transform: scale(.15); opacity: 0; } 6% { opacity: 1; } 22% { transform: scale(1.1); opacity: 1; } 32% { transform: scale(1); } 72% { transform: scale(1.04) translateY(-3%); opacity: 1; } 100% { transform: scale(1.1) translateY(4%); opacity: 0; } }
  @keyframes popGlow { 0% { transform: scale(.9); opacity: .75; } 100% { transform: scale(1.08); opacity: 1; } }
  /* The title is painted lettering on an unrolled scroll (art/lettering/level-complete.webp). It is wider than the parchment, so its rolled ends lie over the frame; the words stay for screen readers. */
  #winCard .title { flex: none; width: 116cqw; aspect-ratio: 900 / 292; margin: -2cqw -8cqw -1cqw; background: url(art/lettering/level-complete.webp) center / contain no-repeat; filter: drop-shadow(0 1.2cqw 1.2cqw #0006); font-size: 0; color: transparent; }
  #winCard .rewards { box-sizing: border-box; width: 96%; aspect-ratio: 4.4; border: 0 solid transparent; border-image: url(art/shop/scroll.webp) 0 70 fill / 0 9cqw stretch; filter: drop-shadow(0 .6cqw .6cqw #0005);
    display: flex; align-items: center; justify-content: space-evenly; padding: 0 8%; }   /* the rewards lie on a vellum scroll */
  #winCard .rewards i { width: 39%; aspect-ratio: 2.2; background: center / 130% auto no-repeat; }
  #next { width: 80%; padding: 3.6cqw 0; border: .9cqw solid #7a4a12; border-radius: 999px; background: linear-gradient(#f2c869, #d99a34 60%, #c98a2b);
    box-shadow: inset 0 1cqw 0 #ffe9a8, inset 0 -1.6cqw 0 #a86a1c, 0 1.4cqw 2cqw #0005;
    font: 700 8.2cqw/1 Cinzel, system-ui, sans-serif; color: #fff; -webkit-text-stroke: .9cqw #7a4a12; paint-order: stroke fill; }
  #next:active { transform: scale(.95); }
  @keyframes winIn { 0% { transform: scale(.4); opacity: 0; } }
  @keyframes twinkle { 0% { opacity: .55; transform: scale(.94) rotate(-3deg); } 100% { opacity: 1; transform: scale(1.04) rotate(3deg); } }

  /* ---- Game systems: tools, score, danger line, ice, tutorial, modals ---- */
  #tools { position: absolute; left: 8px; top: 58px; z-index: 7; display: flex; flex-direction: column; gap: 7px; }
  #tools button { position: relative; width: 46px; height: 46px; border: 0; padding: 0; background: center / contain no-repeat; filter: drop-shadow(0 2px 3px #0006); transition: transform .1s; }
  #tools button:active { transform: scale(.86); }
  #tools em { position: absolute; right: -5px; bottom: -4px; min-width: 19px; height: 19px; padding: 0 4px; border-radius: 99px; background: #fff; color: #2a1a10;
    font: 700 12px/19px Cinzel, system-ui, sans-serif; box-shadow: 0 1px 2px #0005; pointer-events: none; }
  #tools em.cost { background: #c98a2b; color: #fff; }
  #score { position: absolute; left: 34%; right: 34%; top: 83.5%; transform: translateY(-50%); text-align: center; font: 700 13px/1 Cinzel, system-ui, sans-serif; color: #fff;
    -webkit-text-stroke: 1.5px #2a1608; paint-order: stroke fill; }

  /* Danger line: the pile must not settle above it. --danger (0..1) is how close the level is to being lost. */
  #dangerLine { display: none; position: absolute; left: 0; right: 0; top: calc(var(--d) * 1.1); height: 0; border-top: 3px dashed #ffffffb0; pointer-events: none; z-index: 2; }
  #pile.tide #dangerLine { display: block; }
  #dangerLine::before { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--d) * 1.1 + 110px);
    background: linear-gradient(#ff2d55b0, transparent); opacity: var(--danger, 0); }
  #pile.danger #dangerLine { border-color: #ff2d55; animation: dangerPulse .45s ease-in-out infinite alternate; }
  @keyframes dangerPulse { 100% { filter: brightness(1.6); } }

  /* Ice: a frozen sticker cannot be moved or matched until a match is made next to it. */
  .st.ice::after { content: ''; position: absolute; inset: -5%; border-radius: 30%; z-index: 1; border: 2px solid #ffffffe0;
    background: linear-gradient(135deg, #ffffffc8 0 14%, #f4e2d48c 28% 55%, #ecccb288 82%, #ffffffb0); box-shadow: inset 0 0 10px #fff, 0 2px 4px #0003; }
  .st.hinted { z-index: 9; }
  .st.hinted::after { content: ''; position: absolute; inset: -6%; border-radius: 50%; border: 4px solid #fff; box-shadow: 0 0 14px 4px #ffe45c;

  #hand { position: fixed; z-index: 50; width: 56px; height: 56px; margin: -4px 0 0 -22px; opacity: 0; pointer-events: none; filter: drop-shadow(0 4px 4px #0005); }
  #toast.art.blank { display: grid; place-items: center; padding: 14% 17% 1% 21%; color: #fff; white-space: nowrap;
    font: 700 min(5.6vw, 27px)/1 Cinzel, system-ui, sans-serif; -webkit-text-stroke: 2.5px #3a2210; paint-order: stroke fill; }
  /* The plain message board (art/ui/popup-frame.webp, 3:2): a plank under crossed axes, where the words go, over a chest and a blue plate. */
  #toast.art.blank:not(.gift) { --tw: min(128vw, 614px); width: var(--tw); max-width: none; aspect-ratio: 3 / 2; padding: calc(var(--tw) * .195) calc(var(--tw) * .285) calc(var(--tw) * .328); white-space: normal; text-align: center; font-size: calc(var(--tw) * .056); line-height: 1.08; color: #fff3d6; -webkit-text-stroke: 3px #2a1608; filter: drop-shadow(0 6px 8px #0008); }   /* wider than the screen on purpose: the dragon posts and banners run off the sides, and the plank fills the middle */
  #toast.art.blank.long { white-space: normal; text-align: center; font-size: min(4.5vw, 21px); line-height: 1.05; -webkit-text-stroke-width: 2px; }   /* a long message takes two lines on the bar */
  #toast.art.blank.long:not(.gift) { font-size: calc(var(--tw) * .05); -webkit-text-stroke-width: 3px; }
  /* OK is written on the blue plate; a tap anywhere on the board closes it. The board is wider than the game's column, so it is cropped to that column:
     on a phone that is the screen's edge, and on a wide screen it stops the board spilling out past the game. */
  #toast.art.blank:not(.gift) { clip-path: inset(-30px calc((var(--tw) - min(100vw, 480px)) / 2)); }
  #toast.art.blank.show:not(.gift) { pointer-events: auto; cursor: pointer; }
  #toast.art.blank:not(.gift) { height: calc(var(--tw) * 2 / 3); overflow: hidden; }   /* a fixed shape, so a long message can never stretch the board and shift OK off its plate */
  /* the screen behind the board goes dark, and taps there close it rather than reaching the game */
  #toastDim { position: absolute; inset: 0; z-index: 59; background: #0a0604b8; opacity: 0; pointer-events: none; transition: opacity .2s; }
  #toast.art.blank.show:not(.gift) ~ #toastDim { opacity: 1; pointer-events: auto; }
  #toast.art.blank:not(.gift)::after { content: 'OK'; position: absolute; left: 31%; right: 31%; top: 78.4%; height: 16.4%; display: grid; place-items: center; color: #fff; font: 700 calc(var(--tw) * .07)/1 Cinzel, system-ui, sans-serif; letter-spacing: .06em; -webkit-text-stroke: 3px #0c1c3c; paint-order: stroke fill; }
  /* A tutorial tip on the blank fox banner: the message is live text on the bar, up to two lines. */

    -webkit-text-stroke: 2px #3a2210; paint-order: stroke fill; }
  /* The gift banner's empty bar sits further right and lower-middle; longer messages wrap onto two lines. */
  #toast.art.blank.gift { padding: 0 14% 2% 33%; white-space: normal; text-align: center; font-size: min(4.9vw, 23px); line-height: 1.05; }
  #tip { position: absolute; left: 57%; top: 108px; width: max-content; max-width: 68%; text-align: center; transform: translateX(-50%) scale(.8); z-index: 8; opacity: 0; pointer-events: none;
    padding: 9px 16px; border-radius: 99px; background: linear-gradient(#e0b060, #c98a2b); border: 3px solid #fff; box-shadow: 0 4px 10px #0004;
    font: 700 15px/1.25 Cinzel, system-ui, sans-serif; color: #fff; transition: opacity .25s, transform .25s; }
  #tip.on { opacity: 1; transform: translateX(-50%) scale(1); }
  /* Art tip: the message is drawn in the image, so the text is hidden. */
  #tip.art { left: 56%; top: 92px; width: 80%; max-width: none; aspect-ratio: 1000 / 334; padding: 0; border: 0; border-radius: 0; box-shadow: none; color: transparent;
    background: center / contain no-repeat; }

  #modal { display: none; position: absolute; inset: 0; z-index: 45; background: #4228139c; align-items: center; justify-content: center; }

  /* Every pop-up sits on one painted frame (art/ui/popup-panel.webp, 1100 x 733): a parchment sheet in a timber frame, with wolf heads and rune banners
     down its sides. The frame is wider than the screen, so the banners run off its edges and the parchment fills the middle. The border is as wide as the
     timber, which keeps what scrolls on the parchment; the picture's top (wolves and banners) and bottom (ropes and corner plates) keep their shape, and
     the rails between them stretch to fit what the pop-up says. cqw here is the width of the screen (#modal). */
  #modal { container-type: inline-size; overflow: hidden; }
  #mcard { flex: none; width: 116cqw; min-height: 78cqw; max-height: 96%; overflow: auto; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 2.5cqw 2cqw 3cqw; text-align: center;
    border: solid transparent; border-width: 14.3cqw 19.5cqw 14.6cqw; border-image: url(art/ui/popup-panel.webp) 501 179 219 fill / 52.9cqw 18.9cqw 23.1cqw stretch; filter: drop-shadow(0 12px 18px #000a);
    animation: winIn .4s cubic-bezier(.2, 1.5, .4, 1); color: #2a1a10; font: 600 15px/1.4 system-ui, sans-serif; }

  #mcard::-webkit-scrollbar-thumb, #hubBody::-webkit-scrollbar-thumb { min-height: 54px; border-radius: 99px; border: 3px solid transparent; background: linear-gradient(90deg, #ffe9a8, #e0a83c 40%, #a86a1c) padding-box; box-shadow: inset 0 0 0 4.2px #3d1f0a, inset 0 0 0 5.6px #ffe9a8aa; }   /* a gold bar rimmed in dark iron */
  #mcard::-webkit-scrollbar-thumb:active, #hubBody::-webkit-scrollbar-thumb:active { background: linear-gradient(90deg, #fff3c8, #f2c869 45%, #c98a2b) padding-box; }

  .mreward { font: 700 19px/1 Cinzel, system-ui, sans-serif; color: #6b4420; background: #f9eee5; border: 2px solid #ebcaaf; border-radius: 99px; padding: 10px 18px; }

    -webkit-text-stroke: 2px #7a4a12; paint-order: stroke fill; }

    -webkit-text-stroke-color: #7a4a16; }
  /* Pause menu: its own painted frame (art/ui/pause-frame.webp, square, see-through inside, so parchment is drawn behind it). The frame's opening is
     16.5% to 83.5% across and 20.7% to 79.7% down. Each choice is one picture with its word painted in; the text stays for screen readers. */
  #mcard:has(.pausemenu) { position: relative; width: min(104cqw, 62vh); min-height: 0; max-height: none; aspect-ratio: 1; padding: 0; gap: 0; overflow: visible; border: 0; border-image: none;
    background: url(art/ui/pause-frame.webp) center / 100% 100% no-repeat, radial-gradient(ellipse at 50% 45%, #f3e4bd, #e6cf9c 70%, #c9a86a) 50% 50% / 71% 64% no-repeat; }
  .pausemenu { position: absolute; inset: 21.5% 17% 20.6%; display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
  .pausemenu .ptitle { flex: none; width: 46%; aspect-ratio: 600 / 126; background: url(art/ui/pause-title.webp) center / contain no-repeat; filter: drop-shadow(0 2px 2px #0005); }
  #mcard .pausemenu button { flex: none; width: 96%; min-width: 0; aspect-ratio: 790 / 124; padding: 0; border: 0; border-radius: 0; box-shadow: none; background: center / 100% 100% no-repeat;
    font-size: 0; color: transparent; -webkit-text-stroke: 0; filter: drop-shadow(0 3px 3px #0007); }
  /* Close, on every pop-up, is the shop's painted button (art/shop/close.webp): the word is in the picture, the text stays for screen readers */
  #mcard button.pclose { flex: none; width: min(88%, 300px); min-width: 0; aspect-ratio: 720 / 126; padding: 0; border: 0; border-radius: 0; background: url(art/shop/close.webp) center / 100% 100% no-repeat; box-shadow: none; font-size: 0; color: transparent; -webkit-text-stroke: 0; filter: drop-shadow(0 3px 3px #0006); }
  /* A pop-up's own buttons are painted planks between two rune medallions (art/ui/bar-gold.webp; bar-wood.webp for the quieter choice). The medallions keep their shape and the plank stretches. */
  #mcard > button:not(.pclose):not([data-act="save"]) { flex: none; min-width: 0; width: min(100%, 310px); height: 42px; padding: 0 40px 2px; border: 0 solid transparent; border-radius: 0; background: none; box-shadow: none;
    border-image: url(art/ui/bar-gold.webp) 0 97 fill / 0 57px stretch; filter: drop-shadow(0 3px 3px #0006); font-size: 13px; white-space: nowrap; -webkit-text-stroke: 2.5px #5a3410; }   /* 13px: the longest label, "Keep going · watch ad", has to fit between the medallions */
  /* Level failed: what each choice costs picks its plank. The ad is gold, gems are the blue plank, energy the red one. */
  #mcard > .overlogo ~ button[data-act="continue"]:not(.pclose) { border-image-source: url(art/ui/bar-blue.webp); -webkit-text-stroke-color: #10244a; }

    border-image: url(art/ui/bar-blue.webp) 0 97 fill / 0 59.5px stretch; filter: drop-shadow(0 3px 4px #0006); color: #fff; font: 700 min(3.9vw, 15px)/1 Cinzel, system-ui, sans-serif; white-space: nowrap; -webkit-text-stroke: 2px #4a2a0e; paint-order: stroke fill; pointer-events: none; }
  /* The sticker tray is a painted blue board between two roped posts with wolf banners (art/ui/scene-hud.webp, 1000 x 308). It is drawn wider than the screen, so the banners hang
     off its sides and the posts stand at its edges, and it stands on the tray's bottom edge, rising above the tray's box: the stickers lie on the blue boards, and the count is written on the vellum plate on its top rail. */
  #sceneTray { position: relative; flex: none; aspect-ratio: 1000 / 251; z-index: 3; }
  #sceneTray::before { content: ''; position: absolute; left: -8%; bottom: -1%; width: 116%; aspect-ratio: 1000 / 308; background: url(art/ui/scene-hud.webp) center / 100% 100% no-repeat; filter: drop-shadow(0 -3px 5px #0005); pointer-events: none; }
  #scenePlaced { position: absolute; left: 50%; top: -7.6%; z-index: 1; transform: translate(-50%, -50%); color: #4a2a0e; font: 700 min(4.2vw, 17px)/1 Cinzel, system-ui, sans-serif; letter-spacing: .5px; white-space: nowrap; pointer-events: none; }
  #sceneRow { position: relative; display: flex; align-items: center; gap: 8px; height: 100%; margin: 0 6.5%; padding: 1.8% 2px calc(6% + env(safe-area-inset-bottom)); overflow-x: auto; scrollbar-width: none; }   /* the side margins keep scrolled stickers from sliding over the posts */
  #sceneRow::-webkit-scrollbar { display: none; }

  #sceneRow p { margin: auto; padding-top: 1%; text-wrap: balance; color: #fff; font: 700 min(4.5vw, 19px)/1.12 Cinzel, system-ui, sans-serif; text-align: center; text-shadow: 0 1px 2px #0006; }
  #sceneTray button { position: relative; flex: none; height: 100%; aspect-ratio: 1; border: 0; padding: 0; background: center / contain no-repeat; filter: drop-shadow(0 3px 3px #0005); transition: transform .1s; }
  #sceneTray button:active { transform: scale(.9); }
  #sceneTray button em { right: -2px; bottom: 0; }
  /* Player avatar: a sticker in a coloured frame, with the player's level on a star */
  .av { position: relative; display: block; flex: none; width: var(--s, 58px); height: var(--s, 58px); border-radius: 26%; border: calc(var(--s, 58px) * .075) solid var(--ring, #fff);
    background: var(--img) center / 80% no-repeat, radial-gradient(circle at 35% 28%, #fff, #e9d8ae 72%); box-shadow: 0 3px 6px #0005; }
  .av u { position: absolute; left: -22%; bottom: -22%; display: grid; place-items: center; width: 56%; height: 56%; padding-top: 9%; background: url(art/icons/star.webp) center / contain no-repeat; text-decoration: none;
    color: #fff; font: 700 calc(var(--s, 58px) * .25)/1 Cinzel, system-ui, sans-serif; -webkit-text-stroke: 1.5px #8a4a00; paint-order: stroke fill; }
  /* Collection: every scene as a card, finished, in progress or still locked */
  #coll { display: none; position: absolute; inset: 0; z-index: 43; overflow: clip; flex-direction: column; background: #f3d79c url(art/paintings/hub-bg.webp) center top / cover no-repeat; }
  #coll.open { display: flex; animation: mapIn .3s ease-out; }
  #collHead { position: relative; flex: none; display: flex; align-items: flex-end; justify-content: center; height: calc(112px + env(safe-area-inset-top)); padding: env(safe-area-inset-top) 0 10px; }
  #collHead h2 { margin: 0; font: 700 28px/1 Cinzel, system-ui, sans-serif; color: #fff; -webkit-text-stroke: 3px #2a1a10; paint-order: stroke fill; letter-spacing: 1px; }
  #collMe { position: absolute; left: 16px; top: calc(12px + env(safe-area-inset-top)); border: 0; padding: 0; background: none; }
  #collMe:active { transform: scale(.9); }
  /* The hub's gem and energy counters are the same painted holders as on the level screen, side by side. Tapping one does what it does there. */
  #hubCount { position: absolute; right: 10px; top: calc(12px + env(safe-area-inset-top)); display: flex; align-items: flex-start; gap: 6px; width: 54%; max-width: 230px; }
  #partyHud .bar { flex: none; width: 112px; }
  #hubCount .bar, #partyHud .bar { border: 0; padding: 0; background-color: transparent; font-family: Cinzel, system-ui, sans-serif; filter: drop-shadow(0 2px 3px #0004); }
  #hubCount .bar { flex: 1; border: 0; padding: 0; background-color: transparent; font-family: Cinzel, system-ui, sans-serif; filter: drop-shadow(0 2px 3px #0004); }
  #hubCount .hgems, #partyHud .hgems { aspect-ratio: 480 / 143; background-image: url(art/ui/gems.webp); color: #f6e7c4; }
  #hubCount .hgems span, #partyHud .hgems span { left: 29%; width: 45%; top: 17.5%; height: 66%; font-size: 15cqw; }
  #hubCount .henergy, #partyHud .henergy { aspect-ratio: 480 / 207; background-image: url(art/ui/energy.webp); color: #3a1d08; }
  #hubCount .henergy #hubEnergy, #partyHud #phEnergy { left: 27%; width: 49%; top: 18.3%; height: 42.5%; font-size: 15cqw; }
  #hubCount .henergy #hubRegen, #partyHud .pregen { left: 39%; width: 39.6%; top: 67.3%; height: 24%; font-size: 9.5cqw; color: #f6e7c4; }
  /* The hub: Collection, Events and Stories share one screen, with a bar along the bottom to move between them */
  #hubBody { flex: 1; min-height: 0; overflow-y: auto; margin-bottom: calc(26% + 3px + env(safe-area-inset-bottom)); padding: 8px 16px 30px;
    -webkit-mask-image: linear-gradient(#000 calc(100% - 22px), transparent); mask-image: linear-gradient(#000 calc(100% - 22px), transparent); scrollbar-width: none; }
  #hubBody::-webkit-scrollbar { display: none; }
  #hubBody, #hubBody * { touch-action: pan-y; }
  #hubBody.home { padding-bottom: 96px; }
  #hubBody .cgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding-bottom: calc(min(78vw, 320px) * .39 - 55px); }   /* room to scroll the last row clear of the Play button */
  /* The logo's wooden board is blank in the art: the screen's name is written on it. On Home the header has no title, so the logo sits higher. */
  #collHead.slim { height: calc(70px + env(safe-area-inset-top)); }
  #hubBody .hlogo { position: relative; container-type: inline-size; width: min(68%, 270px); aspect-ratio: 760 / 549; margin: -4px auto -10px; background: url(art/lettering/logo-board.webp) center / 100% 100% no-repeat; filter: drop-shadow(0 6px 8px #0004); }
  #hubBody .hrow { display: flex; gap: 6px; margin: 0 -4px 16px; container-type: inline-size; }
  #hubBody .hrow button { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; aspect-ratio: 600 / 201; padding: 0 2cqw 0 12cqw; border: 0; background: url(art/ui/home-button.webp) center / 100% 100% no-repeat;   /* the picture covers the bronze ring, the word on the planks to its right */
    filter: drop-shadow(0 3px 3px #0004); color: #fff3d6; -webkit-text-stroke: 1.5px #2a1608; paint-order: stroke fill; font: 700 4.3cqw/1 Cinzel, system-ui, sans-serif; }
  #hubBody .hrow button:active { transform: translateY(2px) scale(.97); }
  #hubBody .hrow i { position: absolute; left: 22.6%; top: 50%; height: 84%; aspect-ratio: 1; transform: translate(-50%, -50%); background: center / contain no-repeat; }
  #hubBody .hsec { width: min(92%, 340px); aspect-ratio: 900 / 167; margin: -4px 0 -14px -6px; background: url(art/lettering/scenes-sign.webp) center / contain no-repeat; filter: drop-shadow(0 3px 3px #0004); font-size: 0; color: transparent; }   /* the words are painted on the sign; its iron rail tucks in behind the top of the scene frame below */
  #hubPlay small { display: block; margin-top: 2px; letter-spacing: .5px; -webkit-text-stroke-width: 2px; }
  #hubBody .hnote { margin: 4px 6px 14px; padding: 8px 12px; border-radius: 12px; background: #2a1a10d0; color: #fff; font: 600 14px/1.35 Cinzel, system-ui, sans-serif; text-align: center; }
  /* The bottom of Home is one painted wooden frame (art/ui/nav-bar.webp, 1100 x 507): a plank between two dragon heads, where PLAY is written
     (or the name of the tab being shown), over a box of five compartments, one for each tab's icon. --hw is the screen's width, which the frame spans. */
  /* A dark fade rises from the bottom of Home, over the painting and its weather and under everything else, so the cards, Play and the tabs read clearly. */
  #coll::after { content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none; background: linear-gradient(to top, #0a0604cc 0%, #0a0604ad 22%, #0a06047a 45%, #0a06043d 65%, #0a060400 82%); }
  #coll { --hw: min(100vw, 480px); --navh: calc(var(--hw) * 0.4609); }
  #hubPlay { position: absolute; left: 50%; bottom: calc(3px + env(safe-area-inset-bottom) + var(--navh) * .615); transform: translateX(-50%); z-index: 4; width: calc(var(--hw) * .44); height: calc(var(--navh) * .33); min-width: 0; padding: 0;
    border: 0; border-radius: 0; background: none; box-shadow: none; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #ffe9a8; font-size: calc(var(--hw) * .078); -webkit-text-stroke: 3.5px #2a1608; filter: drop-shadow(0 2px 0 #0008); }
  #hubPlay img { display: block; width: calc(var(--hw) * .27); aspect-ratio: 520 / 159; pointer-events: none; }   /* the word is painted gold lettering (art-src/play-word.webp) */
  #hubPlay small { color: #f6e7c4; font-size: calc(var(--hw) * .036); }
  #hubPlay:active { transform: translateX(-50%) scale(.94); }
  #hubNav { position: absolute; left: 0; bottom: calc(3px + env(safe-area-inset-bottom)); z-index: 3; display: flex; align-items: stretch; width: 100%; aspect-ratio: 1100 / 507; padding: 25.6% 2.2% 5.4%;
    background: url(art/ui/nav-bar.webp) center / 100% 100% no-repeat; filter: drop-shadow(0 -3px 6px #0006); pointer-events: none; }
  /* On the other tabs there is no PLAY plank: the frame is one long board (art/ui/nav-plank.webp), painted on the same canvas so the tabs sit where they do on Home */
  #hubNav[data-title] { background-image: url(art/ui/nav-plank.webp); }
  #hubNav button { position: relative; flex: 1; min-width: 0; border: 0; padding: 0 0 4%; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; pointer-events: auto;
    color: #fff3d6; font: 700 11px/1 Cinzel, system-ui, sans-serif; letter-spacing: .3px; -webkit-text-stroke: 1.5px #2a1608; paint-order: stroke fill; }
  #hubNav button i { width: min(54px, 76%); aspect-ratio: 1; margin: -9px 0 -3px; background: center / contain no-repeat; filter: drop-shadow(0 2px 2px #0006); transition: transform .15s; }
  /* The selected tab's icon sits on a blue rune plate in a bronze-cornered frame, which fills its compartment */
  #hubNav button.on { color: #fff; -webkit-text-stroke-color: #10244a; padding-bottom: 0; z-index: 1; }   /* the plate is bigger than its compartment: it stands on the frame's bottom edge and rises above the box */
  #hubNav button.on::before { content: ''; position: absolute; left: 50%; bottom: -17%; height: 150%; aspect-ratio: 1161 / 1083; transform: translateX(-50%); z-index: -1; background: url(art/ui/nav-on.webp) center / 100% 100% no-repeat; filter: drop-shadow(0 2px 3px #0008); }
  #hubNav button.on i { transform: translateY(-7px) scale(1.12); filter: drop-shadow(0 3px 3px #0006); }
  #hubNav button:active i { transform: scale(.9); }
  #hubNav button.soon { opacity: .6; }
  #hubNav em { position: absolute; right: 8%; top: -4px; -webkit-text-stroke: 0; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 99px; background: #c98a2b; color: #fff; font: 700 12px/20px Cinzel, system-ui, sans-serif; font-style: normal; box-shadow: 0 1px 2px #0006; }
  /* Saga Pass: a month-long track of rewards, a free one and a premium one at each tier */
  .passwrap { container-type: inline-size; margin: 0 -9px 14px; }
  /* The Saga Pass header is one painted frame (art/ui/pass-frame.webp, 720 x 914): a plank between an axe and a crown for the title, a parchment sheet that
     stretches to hold the season's details, and a gold plate along the bottom for the premium button. */
  .passcard { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 41.5cqw 10cqw 22.5cqw; border: 0 solid transparent; border-image: url(art/ui/pass-frame.webp) 289 44 151 fill / 40.1cqw 6.1cqw 21cqw stretch; filter: drop-shadow(0 4px 5px #0004); }
  .passcard h3 { margin: 0; color: #5a3410; font: 700 min(6.4cqw, 24px)/1 Cinzel, system-ui, sans-serif; }
  .passcard .ends { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: min(4.3cqw, 16px); }
  .passcard .ends svg { width: 1.35em; height: 1.35em; }
  .passcard .xp { width: 100%; padding: 0; }
  .passcard .xp .bar { height: 34px; border: 0 solid transparent; border-radius: 0; background: none; overflow: visible; border-image: url(art/ui/pass-bar.webp) 0 76 fill / 0 22.3px stretch; }   /* a knotwork trough in a studded gold rim: its pointed ends keep their shape */
  .passcard .xp .bar u { left: 12px; top: 29%; bottom: 28%; width: calc((100% - 24px) * var(--f)); border-radius: 99px; box-shadow: inset 0 2px 0 #f5e4c2; }   /* the fill lies in the trough, inside the rim */
  .passcard .xp .bar b { color: #fff; font-size: 14px; padding-bottom: 1px; -webkit-text-stroke: 1.75px #3d1f0a; paint-order: stroke fill; }   /* outlined, so it reads on the green fill and on the brown trough */
  .passcard .ptitle { position: absolute; left: 22.7%; width: 45.7%; top: 14.1cqw; height: 19.6cqw; background: url(art/lettering/word-saga-pass-premium.webp) center / contain no-repeat; filter: drop-shadow(0 2px 2px #000a); font-size: 0; color: transparent; -webkit-text-stroke: 0; }   /* the words are painted lettering; the text stays for screen readers */
  .passbuy { position: absolute; left: 18.5%; right: 18.5%; bottom: 5cqw; height: 12.1cqw; display: flex; align-items: center; justify-content: center; }   /* on the gold plate */
  .passbuy p { margin: 0; color: #3a1d08; font: 700 3.6cqw/1.1 Cinzel, system-ui, sans-serif; }
  /* Story cards: the painted holder. The title sits in the sky, the status in the grey slot, and the round button on the right opens the story. */
  .scard { position: relative; display: block; width: calc(100% + 16px); aspect-ratio: 900 / 302; margin: 0 -8px 10px; padding: 0; border: 0; background: url(art/ui/story-card.webp) center / 100% 100% no-repeat; container-type: inline-size; filter: drop-shadow(0 4px 5px #0004); text-align: left; }
  .scard[data-story]:active { transform: scale(.97); }
  .scard h3 { position: absolute; left: 39%; right: 4%; top: 21%; height: 24%; display: flex; align-items: center; margin: 0; color: #fff; font: 700 5cqw/1 Cinzel, system-ui, sans-serif; white-space: nowrap; -webkit-text-stroke: .21em #2a1a10; paint-order: stroke fill; }
  .scard p { position: absolute; left: 42%; width: 32%; top: 51.5%; height: 17%; display: grid; place-items: center; margin: 0; color: #fff; font: 600 3.25cqw/1 Cinzel, system-ui, sans-serif; white-space: nowrap; }
  .scard i { position: absolute; left: 85.3%; top: 60%; width: 8.4%; aspect-ratio: 1; transform: translate(-50%, -50%); }
  .scard i svg, .scard i img { display: block; width: 100%; height: 100%; object-fit: contain; }
  .scard i img { filter: drop-shadow(0 1px 1px #0006); }
  /* a story with its own painted holder: the slot and the button sit in slightly different places on each */

  .scard.s1 h3 { left: 36.5%; top: 22%; }

  .scard.s1 i { left: 85.2%; top: 58%; }

  .scard.e0 i { left: 85.8%; top: 62%; }
  .scard.e1 { aspect-ratio: 900 / 293; background-image: url(art/ui/event-card-1.webp); }
  .scard.e1 h3 { left: 37%; top: 20%; }
  .scard.e1 p { left: 43.6%; width: 31.2%; top: 55.4%; height: 16%; }
  .scard.e1 i { left: 85.8%; top: 60.6%; }
  .scard.fresh i svg { animation: pulse .8s ease-in-out infinite alternate; }
  /* The tab's name heads its page in painted gold lettering (art/lettering/word-*.webp), the words that used to sit on the bar's plank */
  #hubBody .elogo { width: min(60%, 232px); aspect-ratio: 598 / 150; margin: 6px auto 14px; background: url(art/lettering/word-events.webp) center / contain no-repeat; filter: drop-shadow(0 3px 3px #000a); }
  #hubBody .slogo { width: min(64%, 250px); aspect-ratio: 646 / 150; margin: 6px auto 14px; background: url(art/lettering/word-stories.webp) center / contain no-repeat; filter: drop-shadow(0 3px 3px #000a); }
  .passcard p { margin: 0; color: #5a3410; font: 600 min(3.5vw, 14px)/1.25 Cinzel, system-ui, sans-serif; text-align: center; }

  .passcard .xp i { font: 700 15px/38px Cinzel, system-ui, sans-serif; font-style: normal; color: #fff; -webkit-text-stroke: 1.5px #8a4a00; paint-order: stroke fill; text-align: center; padding-top: 3px; }
  .passcard .xp i:first-child { width: 54px; height: 54px; margin: -8px -5px -8px -8px; padding: 0 3px 1px 0; display: flex; align-items: flex-end; justify-content: flex-end; font-size: 16px; line-height: 1; -webkit-text-stroke: 3px #3d1f0a; filter: drop-shadow(0 2px 2px #0005); }   /* the season medal, bigger than the row; the tier number sits at its corner so the emblem shows */
  .passbuy button, #hubBody .passall { padding: 9px 20px; border-radius: 99px; border: 3px solid #c9770a; background: linear-gradient(#ffe98a, #ffc928 60%, #f5a300); box-shadow: inset 0 3px 0 #fff6c4, inset 0 -4px 0 #d98a00, 0 3px 5px #0004;
    color: #fff; font: 700 16px/1 Cinzel, system-ui, sans-serif; -webkit-text-stroke: 2px #b86a00; paint-order: stroke fill; }
  #hubBody .passall { display: block; margin: 0 auto 14px; border-color: #7a4a12; background: linear-gradient(#f2c869, #d99a34 60%, #c98a2b); box-shadow: inset 0 3px 0 #ffe9a8, inset 0 -4px 0 #a86a1c, 0 3px 5px #0004; -webkit-text-stroke-color: #7a4a12; }
  .passbuy button:active, #hubBody .passall:active { transform: scale(.94); }
  .passbuy button { width: 100%; height: 100%; padding: 0; border: 0; border-radius: 0; background: none; box-shadow: none; color: #fff; font-size: 4.1cqw; -webkit-text-stroke: .16em #3a1d08; paint-order: stroke fill; white-space: nowrap; }   /* plain words: the plate is the button */
  /* The reward list hangs on a dark plank board (art/ui/pass-board.webp, 1000 x 350) with wolf heads and torches at its top corners. The top and bottom of the
     picture keep their shape; the planks and knotwork posts between them repeat for as long as the list runs. --pbw is the board's width. */
  .passboard { --pbw: calc(var(--hw) - 14px); margin: 0 -9px 14px; padding: calc(var(--pbw) * .1) calc(var(--pbw) * .085) calc(var(--pbw) * .075); border: 0 solid transparent;
    border-image: url(art/ui/pass-board.webp) 197 75 90 fill / calc(var(--pbw) * 0.1970) calc(var(--pbw) * 0.0750) calc(var(--pbw) * 0.0900) stretch round; filter: drop-shadow(0 4px 6px #0007); }
  .passboard .passtrack { padding-bottom: 0; }
  #hubBody.pass { padding-bottom: calc(var(--navh) * .5); }   /* room to scroll the board's foot clear of the plank that stands over the bottom of the page */
  .passhead, .passrow { display: grid; grid-template-columns: 1fr 46px 1fr; align-items: center; gap: 10px; margin-bottom: 8px; }
  .passhead b { color: #fff; font: 700 17px/1 Cinzel, system-ui, sans-serif; text-align: center; -webkit-text-stroke: 2px #2a1a10; paint-order: stroke fill; }
  .passhead b.free { display: grid; place-items: center; height: 34px; margin: 0 -7px; padding-bottom: 1.5%; border: 0 solid transparent; border-image: url(art/ui/pass-cell-free.webp) 0 127 fill / 0 20px stretch; filter: drop-shadow(0 2px 2px #0004); font-size: 16px; -webkit-text-stroke-color: #0c1c3c; }
  .passhead b.prem { position: relative; display: grid; place-items: center; height: 34px; margin: 0 -7px; padding: 0 0 1.5% 12%; border: 0 solid transparent; border-image: url(art/ui/pass-cell-premium.webp) 0 108 fill / 0 17px stretch; filter: drop-shadow(0 2px 2px #0004); font-size: 16px; color: #fff; -webkit-text-stroke-color: #4a2a08; }
  .passhead b.prem::before { content: ''; position: absolute; left: 15%; top: 50%; width: 20px; height: 20px; transform: translateY(-54%); background: url(art/ui/pass-lock.webp) center / contain no-repeat; }
  /* The tier stars are threaded on a wooden pole that runs the length of the track. Its roped ends keep their shape; the plain middle stretches. */
  .passtrack { position: relative; padding: 4px 0 10px; }
  .passtrack::before { content: ''; position: absolute; left: 50%; top: -46px; bottom: -4px; width: 30px; transform: translateX(-50%); border: 0 solid transparent; border-image: url(art/ui/pass-stick.webp) 251 0 98 fill / 68px 0 27px stretch round; filter: drop-shadow(1px 2px 2px #0006); }   /* a studded torch post: its burning head stands between the two headers, and the studded pole repeats down the list */
  .passtrack .passrow { position: relative; }
  /* Each tier's number sits on a blue gem in a silver diamond setting. A tier not yet reached is dimmed; a reached one shines. */
  .passrow .tier { display: grid; place-items: center; width: 50px; height: 50px; margin: 0 -2px; background: url(art/ui/pass-tier.webp) center / contain no-repeat; filter: saturate(.45) brightness(.72);
    color: #fff; font: 700 16px/1 Cinzel, system-ui, sans-serif; -webkit-text-stroke: 2.5px #0c1c3c; paint-order: stroke fill; }
  .passrow.on .tier { filter: drop-shadow(0 0 5px #5cc8ff); }
  /* Reward cells: the painted holders, blue for free and gold for premium, shown as drawn. A reward ready to claim pulses with a green glow. */
  .pcell { position: relative; display: flex; align-items: center; justify-content: center; gap: 8px; height: 62px; padding: 0 8px 2px; border: 0 solid transparent; background: none; border-image: url(art/ui/pass-cell-free.webp) 0 127 fill / 0 36px stretch; color: #fff; -webkit-text-stroke: 2px #0c1c3c; paint-order: stroke fill;   /* a free reward lies on a blue plank: its bronze ends keep their shape, the boards between stretch */ font: 700 18px/1 Cinzel, system-ui, sans-serif; }
  .pcell img { width: 38px; height: 38px; object-fit: contain; }
  .pcell.paid { border-image: url(art/ui/pass-cell-premium.webp) 0 108 fill / 0 30px stretch; color: #fff; -webkit-text-stroke: 2px #4a2a08; }   /* a premium reward lies on a gold plank */
  .pcell.can { animation: pulse .8s ease-in-out infinite alternate; filter: drop-shadow(0 0 5px #dfa83b) drop-shadow(0 0 2px #b87a22); }
  .pcell.got { opacity: .7; }
  .pcell.got::after { content: ''; position: absolute; right: -6px; top: -8px; width: 26px; height: 26px; border-radius: 50%; border: 2px solid #fff; background: #c98a2b

  /* Event and story cards */

  /* Reading a story: a picture built from a painting and stickers, with a line of text under it */

  /* The window is wider than the scene is tall, so it shows the scene's full width, placed so the picnic is centred in the part the title does not cover. */

  .pget[disabled], .pad[disabled] { opacity: 0; pointer-events: none; }
  .pad { margin-top: -2px; padding: 10px 22px; border-radius: 99px; border: 3px solid #7a4a16; background: linear-gradient(#e0b060, #c98a2b 60%, #7a4a16); box-shadow: inset 0 3px 0 #efe0b8, inset 0 -4px 0 #5a3618, 0 4px 8px #0004;
    font: 700 17px/1 Cinzel, system-ui, sans-serif; color: #fff; -webkit-text-stroke: 2px #7a4a16; paint-order: stroke fill; }
  .pad:active { transform: scale(.94); }
  .pstar { display: grid; place-items: center; width: 190px; height: 190px; margin: 6px 0; background: url(art/icons/star.webp) center / contain no-repeat; filter: drop-shadow(0 0 24px #fff8b0) drop-shadow(0 8px 8px #0004);
    font: 700 84px/1 Cinzel, system-ui, sans-serif; color: #fff; -webkit-text-stroke: 6px #a85a00; paint-order: stroke fill; padding-top: 22px; animation: starIn .7s cubic-bezier(.2, 1.6, .4, 1) backwards, pulse 1s ease-in-out .7s infinite alternate !important; }
  @keyframes starIn { from { transform: scale(0) rotate(-140deg); } }
  /* The level-up chest is a three-frame sprite (art/ui/chest-sprite.webp): shut, lid lifting, wide open. Shut, it hops to ask for a tap.
     Tapped, it crouches, then the frames play through with a pop on each, and it settles open. */
  .pchest { width: min(68vw, 270px); aspect-ratio: 456 / 440; border: 0; padding: 0; background: url(art/ui/chest-sprite.webp) 0 0 / 300% 100% no-repeat; filter: drop-shadow(0 10px 10px #0005); transform-origin: 50% 92%; animation: chestIdle 1.5s ease-in-out infinite !important; }
  .pchest.f1 { background-position: 50% 0; }
  .pchest.f2 { background-position: 100% 0; }
  .pchest.opening { animation: chestOpen 1s cubic-bezier(.3, 1.4, .5, 1) both !important; pointer-events: none; }
  @keyframes chestIdle { 0%, 55%, 100% { transform: translateY(0) scale(1); } 62% { transform: translateY(0) scale(1.06, .93); } 74% { transform: translateY(-7%) scale(.96, 1.05) rotate(-3deg); } 86% { transform: translateY(0) scale(1.04, .96) rotate(2deg); } }
  @keyframes chestOpen { 0% { transform: scale(1); } 14% { transform: scale(1.12, .84); } 22% { transform: scale(.94, 1.1) translateY(-3%); } 30% { transform: scale(1.04, .97); } 44% { transform: scale(.9, 1.14) translateY(-6%); } 56% { transform: scale(1.1, .94); } 70% { transform: scale(.98, 1.03); } 100% { transform: scale(1); } }
  .phint { font: 600 17px/1.2 Cinzel, system-ui, sans-serif; color: #fff; text-shadow: 0 1px 3px #0008; }
  .balloon { position: absolute; bottom: -90px; width: 62px; height: 76px; border-radius: 50% 50% 50% 50% / 45% 45% 55% 55%; border: 3px solid #2a1a10; box-shadow: inset -8px -8px 0 #0002, inset 8px 8px 0 #fff5; animation: balloonUp 5s linear forwards; }
  .balloon::after { content: ''; position: absolute; left: 50%; top: 100%; width: 2px; height: 60px; background: #2a1a1099; }
  @keyframes balloonUp { to { transform: translateY(-120vh) rotate(8deg); } }
  .rstars { display: flex; justify-content: center; gap: 4px; margin: 14px 0 16px; }
  #mcard .rstars button { flex: none; width: 46px; min-width: 0; height: 46px; margin: 0; border: 0; border-radius: 0; padding: 0; box-shadow: none; background: url(art/icons/star.webp) center / contain no-repeat; filter: grayscale(1) opacity(.45); transition: transform .1s; }
  #mcard .rstars button.on { filter: none; }
  #mcard .rstars button:active { transform: scale(.85); }
  #scene.celebrate #sceneBack, #scene.celebrate #sceneTitle, #scene.celebrate #sceneLv { display: none; }
  @keyframes spin { 100% { transform: rotate(360deg); } }

  #pauseBtn { position: absolute; left: 56px; top: 8px; transition: transform .1s; }
  #pauseBtn:active { transform: scale(.88); }

  /* Worlds: every five levels the scene changes. With its own painting (#app.artworld) the tint and the beach-specific sparkle are switched off;
     without one, the original beach is re-lit by a tint that sits over the background and under everything else. */
  #app.artworld #fxBg::before { opacity: 0 !important; }
  #app.artworld #water, #app.artworld #fxBg > .tw { display: none; }
  #fxBg::before { content: ''; position: absolute; inset: 0; pointer-events: none; mix-blend-mode: multiply; opacity: 0; transition: opacity 1s; }
  #app[data-tint="1"] #fxBg::before { background: linear-gradient(#ff9a5a, #ffb37a 45%, #ffd7a8); opacity: .78; }
  #app[data-tint="2"] #fxBg::before { background: linear-gradient(#704d31, #8e6748 50%, #b59275); opacity: .86; }
  #app[data-tint="3"] #fxBg::before { background: linear-gradient(#ffb3d1, #ffd9c2 50%, #fff3d6); opacity: .8; }
  .levels h4 { grid-column: 1 / -1; margin: 6px 0 0; text-align: left; font: 700 15px/1 Cinzel, system-ui, sans-serif; color: #3a2210; }
  .chest { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; border-radius: 14px; background: #fff6c9;
    border: 2px solid #ffb300; font: 700 14px/1.2 Cinzel, system-ui, sans-serif; color: #8a4b00; text-align: left; }
  #mcard .chest button, #mcard .small { min-width: 0; padding: 7px 12px; font-size: 13px; -webkit-text-stroke-width: 1.5px; }
  #mcard .linkbtn { min-width: 0; padding: 2px; border: 0; background: none; box-shadow: none; -webkit-text-stroke: 0; font: 600 13px/1 system-ui, sans-serif;
    color: #6b4420; text-decoration: underline; }
  .astk span { position: relative; }
  .astk u { position: absolute; right: 2px; bottom: 2px; width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 1px 2px #0005; }
  .help { width: 100%; margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; text-align: left; }
  .help li { background: #fff; border: 2px solid #e9d8ae; border-radius: 14px; padding: 6px 11px; font-size: 14px; line-height: 1.35; }
  .help { gap: 6px !important; }
  .help b { color: #3a2210; }
  /* Test tools only show in debug builds. */
  #cheats .dev { display: none; }
  #app.debug #cheats .dev { display: flex; }

  /* World effects: each painted world gets its own moving details. Fixed pieces are laid out from the painting's pixel
     positions; drifting pieces (.fxm) are spawned on a timer and remove themselves. */
  .fxm { position: absolute; pointer-events: none; }
  .puff { border-radius: 50%; filter: blur(6px); }
  .flake { border-radius: 50%; background: #fff; box-shadow: 0 0 4px #fff; }
  .ember { width: 5px; height: 5px; border-radius: 50%; background: #ffc15a; box-shadow: 0 0 6px 2px #ff6a00; }
  .firefly { width: 6px; height: 6px; border-radius: 50%; background: #fff7a8; box-shadow: 0 0 9px 4px #ffe45caa; }
  .gull { width: 26px; height: 12px; }
  .gull svg { display: block; width: 100%; height: 100%; fill: none; stroke: #3b4b66; stroke-width: 2.4; stroke-linecap: round; transform-origin: 50% 70%;
    animation: flap .45s ease-in-out infinite alternate; }
  .twk { position: absolute; background: radial-gradient(#fff 25%, #fff3a8 55%, #ffd95a); animation: twinkle ease-in-out infinite;
    clip-path: polygon(50% 0, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0 50%, 40% 40%); }
  .twk.w { background: #fff; }
  .band { position: absolute; left: 0; right: 0; overflow: hidden; }
  .fall { position: absolute; mix-blend-mode: soft-light; opacity: .4; filter: blur(2px); -webkit-mask-image: radial-gradient(ellipse at center, #000 25%, transparent 72%); mask-image: radial-gradient(ellipse at center, #000 25%, transparent 72%);   /* a faint shimmer that fades out at its edges, so it need not trace the painted fall */
    background: repeating-linear-gradient(#ffffff00 0 6px, #ffffffc0 8px 11px, #ffffff00 14px 22px) 0 0 / 100% 22px; animation: fallDown .55s linear infinite; }
  .caustic { position: absolute; inset: 0; mix-blend-mode: soft-light; opacity: .75; animation: causticDrift 9s linear infinite;
    background: radial-gradient(ellipse 60px 34px at 30% 30%, #ffffffb0, transparent 70%) 0 0 / 180px 120px,
      radial-gradient(ellipse 50px 30px at 70% 60%, #ffffff90, transparent 70%) 40px 60px / 220px 150px; }
  .glow { position: absolute; border-radius: 50%; transform: translate(-50%, -50%); animation: glowPulse 3.4s ease-in-out infinite alternate; }
  .rays { position: absolute; inset: 0; mix-blend-mode: soft-light; animation: raySway 7s ease-in-out infinite alternate;
    background: repeating-linear-gradient(115deg, transparent 0 60px, #fffbd266 80px 110px, transparent 130px 220px);
    -webkit-mask-image: linear-gradient(#000, transparent 78%); mask-image: linear-gradient(#000, transparent 78%); }
  @keyframes flap { to { transform: scaleY(.3); } }
  @keyframes fallDown { to { background-position-y: 22px; } }
  @keyframes causticDrift { to { background-position: 180px 120px, -180px 210px; } }
  @keyframes glowPulse { from { opacity: .45; transform: translate(-50%, -50%) scale(.9); } to { opacity: .95; transform: translate(-50%, -50%) scale(1.12); } }
  @keyframes raySway { from { opacity: .35; transform: translateX(-12px); } to { opacity: .85; transform: translateX(12px); } }

  /* Campaign map: every level is a node on a path across the islands of art/paintings/map.webp. The stage keeps the painting's shape
     and everything on it is placed in % of the painting, so nodes stay on their islands at any screen size. */
  #map { display: none; position: absolute; inset: 0; z-index: 44; overflow: hidden; background: linear-gradient(#d89761, #d38a4f 55%, #9a6a30); }
  #map.open { display: block; animation: mapIn .3s ease-out; }
  #mapStage { position: absolute; left: 0; top: 0; container-type: inline-size; background: url(art/paintings/map.webp) center / 100% 100% no-repeat; will-change: transform; cursor: grab; }
  #map.dragging #mapStage { cursor: grabbing; }
  #mapStage svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .mnode { position: absolute; width: 7.6cqw; aspect-ratio: 1; transform: translate(-50%, -50%); border: 0; padding: 0; background: url(art/ui/map-node.webp) center / contain no-repeat;
    font: 700 2.9cqw/1 Cinzel, system-ui, sans-serif; color: #fff; -webkit-text-stroke: .4cqw #3a2210; paint-order: stroke fill; }
  .mnode.done { width: 8.4cqw; background-image: url(art/ui/map-star.webp); -webkit-text-stroke-color: #8a4a00; padding-bottom: 1.2cqw; }
  .mnode.crown { width: 11cqw; background-image: url(art/ui/map-crown.webp); padding-top: 4.6cqw; font-size: 3.4cqw; }   /* the last level of a land: its number is written across the crown's band */
  .mnode.locked { filter: grayscale(.85) brightness(.92); opacity: .85; font-size: 2.6cqw; }
  .mnode.cur { animation: nodePulse .8s ease-in-out infinite alternate; z-index: 2; }
  .mnode:active { filter: brightness(1.15); }
  .mnode em { position: absolute; left: 50%; top: 94%; transform: translateX(-50%); display: flex; gap: .2cqw; }
  .mnode em i { width: 2.4cqw; aspect-ratio: 240 / 230; background: url(art/icons/rating-star.webp) center / contain no-repeat; filter: grayscale(1) brightness(1.5) opacity(.75); }
  .mnode em i.on { filter: drop-shadow(0 .2cqw .15cqw #0006); }
  .mfox { position: absolute; width: 7.6cqw; aspect-ratio: 540 / 430; transform: translate(-50%, -122%); background: url(art/icons/fox.webp) center / contain no-repeat; pointer-events: none; z-index: 3;
    filter: drop-shadow(0 .6cqw .5cqw #0005); animation: foxBob 1.1s ease-in-out infinite alternate; }
  .mlock { position: absolute; width: 7.4cqw; aspect-ratio: 1; transform: translate(-50%, -50%); background: url(art/ui/map-lock.webp) center / contain no-repeat; pointer-events: none; }
  .mlabel { position: absolute; width: 33cqw; aspect-ratio: 640 / 196; transform: translate(-50%, -50%); background: url(art/ui/map-banner.webp) center / contain no-repeat; pointer-events: none;
    display: grid; place-items: center; padding: 0 6.6cqw .3cqw; white-space: nowrap; font: 700 2.1cqw/1 Cinzel, system-ui, sans-serif; color: #fff6e0;
    -webkit-text-stroke: .34cqw #4a2408; paint-order: stroke fill; }
  .mlabel.locked { filter: grayscale(.5) brightness(.95); }
  #mapBack { position: absolute; left: 10px; top: calc(10px + env(safe-area-inset-top)); width: 50px; height: 46px; border: 0; background: url(art/ui/map-back.webp) center / contain no-repeat; z-index: 4; }
  #mapBack:active, #mapChest:active { transform: scale(.9); }
  #mapLogo { position: absolute; left: 50%; top: calc(4px + env(safe-area-inset-top)); width: min(44%, 176px); aspect-ratio: 640 / 358; transform: translateX(-50%);
    background: url(art/lettering/map-logo.webp) center / contain no-repeat; pointer-events: none; z-index: 3; filter: drop-shadow(0 3px 4px #0004); }
  /* Star total, top right: the pill art has the star painted on its left, so the number sits in the open blue area to its right. */
  #mapStars { position: absolute; right: 8px; top: calc(12px + env(safe-area-inset-top)); z-index: 4; width: 100px; height: 36px; background: url(art/ui/map-stars.webp) center / 100% 100% no-repeat;
    display: grid; place-items: center; padding: 2px 10px 0 42px; font: 700 16px/1 Cinzel, system-ui, sans-serif; color: #fff; -webkit-text-stroke: 2px #3a2210; paint-order: stroke fill;
    filter: drop-shadow(0 3px 3px #0004); }
  /* Star chest: a bar under it fills as stars are earned. When full the chest glows, hops and shows a badge; tapping opens a reward card. */
  #mapChest { position: absolute; right: 10px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 4; width: 108px; border: 0; padding: 0; background: none;
    display: flex; flex-direction: column; align-items: center; }
  #mapChest .cimg { position: relative; width: 66px; aspect-ratio: 220 / 209; background: url(art/ui/map-chest.webp) center / contain no-repeat; filter: drop-shadow(0 4px 4px #0005); }
  /* The holder art has the star painted on its left; the count sits in the open blue area beside it. */
  #mapChest .cbar { position: relative; width: 108px; height: 29px; margin-top: -5px; background: url(art/ui/map-chest-bar.webp) center / 100% 100% no-repeat; filter: drop-shadow(0 3px 3px #0005); }
  #mapChest .cbar u { position: absolute; inset: 0; display: grid; place-items: center; padding: 1px 8px 0 34px; text-decoration: none; white-space: nowrap;
    font: 700 13px/1 Cinzel, system-ui, sans-serif; color: #fff; -webkit-text-stroke: 1.75px #3a2210; paint-order: stroke fill; }
  #mapChest.ready .cimg { animation: chestHop .5s ease-in-out infinite alternate; filter: drop-shadow(0 0 8px #ffe45c) drop-shadow(0 0 3px #fff) drop-shadow(0 4px 4px #0005); }
  #mapChest.ready .cimg::after { content: '!'; position: absolute; right: -4px; top: -6px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
    background: #ff3b5c; border: 2px solid #fff; font: 700 14px/1 Cinzel, system-ui, sans-serif; color: #fff; }
  #mapChest.ready .cbar u { color: #ffe45c; }
  .chestBig { width: 130px; aspect-ratio: 220 / 209; background: url(art/ui/map-chest.webp) center / contain no-repeat; filter: drop-shadow(0 0 14px #ffe45c); animation: chestHop .5s ease-in-out infinite alternate; }
  .loot { display: flex; gap: 10px; }
  .loot div { min-width: 96px; padding: 10px 12px; border-radius: 16px; background: #fff; border: 2px solid #e9d8ae; font: 700 17px/1.2 Cinzel, system-ui, sans-serif; color: #3a2210; }
  .loot img { display: block; height: 30px; margin: 0 auto 4px; }
  .loot span { display: block; font-size: 26px; line-height: 30px; margin-bottom: 4px; }
  #mapAll { position: absolute; left: 10px; bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 4; padding: 8px 14px; border-radius: 99px; background: #3a2210e6; border: 2px solid #fff;
    font: 700 13px/1 Cinzel, system-ui, sans-serif; color: #fff; }
  .lsheet { display: flex; gap: 6px; }
  .lsheet i { display: block; width: 34px; }
  @keyframes mapIn { from { opacity: 0; transform: scale(1.06); } }
  @keyframes nodePulse { to { transform: translate(-50%, -50%) scale(1.14); } }
  @keyframes foxBob { to { transform: translate(-50%, -132%); } }
  @keyframes chestHop { to { transform: translateY(-5px) rotate(-4deg); } }

  /* Earned stars use the painted star; unearned ones are the same star, greyed out. */
  #winStars span, .lsheet i { aspect-ratio: 240 / 230; background: url(art/icons/rating-star.webp) center / contain no-repeat; filter: grayscale(1) brightness(1.2) opacity(.4); }
  #winStars span.on, .lsheet i.on { filter: drop-shadow(0 2px 2px #b5430b66); }

  /* Shop */
  /* ---- The shop: a painted timber frame round a parchment sheet (art/shop/frame.webp, 900 x 1578), filled with the painted parts in art/shop/.
     The frame's top (wolf heads, torches, the name plank, the upper clasps) and its bottom (knotwork panels and corner plates) keep their shape;
     the plain rails and parchment between them stretch to the height of what is on sale. ---- */
  #mcard:has(.shopui) { container-type: inline-size; width: min(100%, 470px); min-height: 0; margin: auto 0; padding: 0 0 5cqw; gap: 0; overflow: visible; max-height: none; background: none; border: 0; border-image: none; border-radius: 0; box-shadow: none; filter: none; }
  #modal:has(.shopui) { align-items: flex-start; overflow-y: auto; padding: 3% 0; background: #140c08c9; }   /* the card's own auto margins centre it; on a short screen it starts at the top and scrolls, so its head is never cut off */
  .shopui { position: relative; container-type: inline-size; width: 100%; min-height: 116cqw; display: flex; flex-direction: column; align-items: center; gap: 2.2cqw; padding: 38.5cqw 11.5cqw 13cqw;
    border: 0 solid transparent; border-image: url(art/shop/frame.webp) 505 95 525 fill / 56.1cqw 10.6cqw 58.3cqw stretch; filter: drop-shadow(0 12px 18px #000a); }
  .shopui .shead { position: absolute; left: 0; top: 0; width: 100%; height: 38cqw; pointer-events: none; }
  .shopui .shead i { position: absolute; background: center / contain no-repeat; filter: drop-shadow(0 3px 3px #0009); }
  .shopui .shead .sword { left: 34%; width: 32%; top: 18.7cqw; aspect-ratio: 313 / 102; background-image: url(art/shop/word-shop.webp); }      /* SHOP, on the frame's plank */
  .shopui .shead .sbarrel { left: 7%; width: 24%; top: 21.5cqw; aspect-ratio: 253 / 184; background-image: url(art/shop/barrel.webp); }
  .shopui .shead .schest { right: 7%; width: 24%; top: 19.5cqw; aspect-ratio: 292 / 228; background-image: url(art/shop/chest.webp); }
  .shopui .sscroll { width: 100%; padding: 2.6cqw 7cqw 3cqw; border: 0 solid transparent; border-image: url(art/shop/scroll.webp) 0 70 fill / 0 9cqw stretch; color: #3a2210; font: 600 2.75cqw/1.2 Georgia, serif; white-space: nowrap; }
  .shopui .sbal { display: flex; align-items: center; gap: 2cqw; color: #2a1608; font: 700 7cqw/1 Cinzel, Georgia, serif; }
  .shopui .sbal img { width: 8cqw; }
  .shopui .packs { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 2cqw; margin: 0; }
  #mcard .shopui button { min-width: 0; margin: 0; padding: 0; border: 0; border-radius: 0; background: center / 100% 100% no-repeat; box-shadow: none; -webkit-text-stroke: 0; transition: transform .1s; }
  #mcard .shopui button:active { transform: scale(.96); }
  .shopui .scard2 { position: relative; width: 100%; aspect-ratio: 375 / 204; filter: drop-shadow(0 3px 3px #0006); }
  .shopui .scard2:nth-child(n+3) { aspect-ratio: 380 / 246; }
  .shopui .scard2.wide { aspect-ratio: 760 / 175; }
  .shopui .scard2 i, #mcard .shopui .sprice { display: grid; place-items: center; padding-bottom: .5cqw; color: #fff; font: 700 5cqw/1 Cinzel, Georgia, serif; font-style: normal; -webkit-text-stroke: .9cqw #5a330c; paint-order: stroke fill; white-space: nowrap; }
  .shopui .scard2 i { position: absolute; }
  .shopui .scard2.have { filter: grayscale(.7) brightness(.8); }
  .shopui .snoads { width: 100%; display: flex; align-items: center; gap: 2.5cqw; padding: 1.6cqw 2cqw; border-radius: 2cqw; background: #f6e7bf66; box-shadow: inset 0 0 0 .4cqw #a8854a66; text-align: left; }
  .shopui .snoads img { width: 15cqw; flex: none; filter: drop-shadow(0 2px 2px #0006); }
  .shopui .snoads div { flex: 1; min-width: 0; }
  .shopui .snoads b { display: block; color: #2a1608; font: 700 5cqw/1.1 Cinzel, Georgia, serif; text-transform: uppercase; }
  .shopui .snoads small { display: block; margin-top: .6cqw; color: #4a3018; font: 500 3.1cqw/1.2 Georgia, serif; }
  #mcard .shopui .sprice { flex: none; width: 27cqw; aspect-ratio: 201 / 90; background-image: url(art/shop/price.webp); filter: drop-shadow(0 2px 2px #0006); }
  .shopui .owned { font-size: 3.6cqw; }
  .shopui .srestore { width: 100%; display: flex; align-items: center; justify-content: center; gap: 3cqw; }
  .shopui .srestore::before, .shopui .srestore::after { content: ''; width: 15cqw; aspect-ratio: 84 / 41; background: url(art/shop/orn-l.webp) center / contain no-repeat; }
  .shopui .srestore::after { background-image: url(art/shop/orn-r.webp); }
  #mcard .shopui .srestore button { color: #3a2210; font: 500 3.6cqw/1 Georgia, serif; text-decoration: underline; text-underline-offset: .25em; }
  #mcard .shopui .sclose { width: 104%; aspect-ratio: 720 / 126; margin: 1cqw 0 -9.5cqw; background-image: url(art/shop/close.webp); filter: drop-shadow(0 4px 4px #0008); }   /* sits over the frame's bottom rail */
  .testmode { font: 700 12px/1.3 system-ui, sans-serif; color: #8a4b00; background: #ffe9a8; border: 2px dashed #e8a200; border-radius: 10px; padding: 6px 10px; }
  .balance { display: flex; align-items: center; gap: 6px; font: 700 22px/1 Cinzel, system-ui, sans-serif; color: #3a2210; }
  .gem { display: block; width: 30px; height: auto; }
  .offer { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; text-align: left; padding: 12px; border-radius: 18px;
    background: linear-gradient(#fff6c9, #ffe07a); border: 3px solid #ffb300; box-shadow: 0 4px 0 #e89a00; }
  .offer.plain { background: #fff; border-color: #e9d8ae; box-shadow: 0 4px 0 #e9d8ae; }
  .offer b { display: block; font: 700 18px/1.1 Cinzel, system-ui, sans-serif; color: #3a2210; }
  .bi { display: inline-block; height: 1.7em; width: auto; vertical-align: middle; margin: -3px 1px 0; }
  .help .bi { height: 1.9em; }
  .offer small { display: block; font: 600 12px/1.3 system-ui, sans-serif; color: #4b6580; margin-top: 3px; }
  .packs { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 12px 10px; margin-top: 4px; }
