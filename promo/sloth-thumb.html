<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Strategic Sloth promo thumbnail</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { width:1920px; height:1080px; overflow:hidden; background:#0b0f0c; color:#eef1e6; font-family:'Manrope',sans-serif; position:relative; }
.grid { position:absolute; inset:0; background-image:linear-gradient(#283027 1px,transparent 1px),linear-gradient(90deg,#283027 1px,transparent 1px); background-size:96px 96px; opacity:.5; }
.glow { position:absolute; left:-420px; top:-380px; width:1500px; height:1500px; border-radius:50%; background:radial-gradient(circle,rgba(198,242,122,.2),transparent 62%); }
.persp { position:absolute; left:1010px; top:120px; width:1100px; height:800px; perspective:2200px; }
.shot { position:absolute; width:1040px; border-radius:22px; border:2px solid #3a4638; box-shadow:0 60px 140px -30px #000; transform:rotateY(-20deg) rotateX(6deg) rotateZ(1deg); }
.shot.back { left:150px; top:-70px; filter:brightness(.5); transform:translateZ(-260px) rotateY(-20deg) rotateX(6deg) rotateZ(1deg); }
.shot.front { left:0; top:150px; }
.blend { position:absolute; inset:0; background:linear-gradient(90deg,#0b0f0c 0,rgba(11,15,12,.92) 44%,rgba(11,15,12,0) 62%),linear-gradient(0deg,rgba(11,15,12,.9),transparent 26%); }
.brand { position:absolute; left:96px; top:84px; display:flex; align-items:center; gap:24px; font-size:60px; font-weight:800; letter-spacing:-.045em; }
.brand img { width:104px; height:104px; background:#f6f5ef; border-radius:22%; }
.brand span { color:#c6f27a; }
.copy { position:absolute; left:96px; top:270px; }
.eyebrow { font-family:'JetBrains Mono',monospace; font-size:32px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:#c6f27a; }
.eyebrow i { display:inline-block; width:20px; height:20px; border-radius:50%; background:#c6f27a; margin-right:20px; }
h1 { margin-top:40px; font-size:214px; font-weight:800; letter-spacing:-.065em; line-height:.9; }
h1 span { color:#c6f27a; display:block; }
.sub { margin-top:50px; font-size:56px; font-weight:700; letter-spacing:-.04em; }
.pill { position:absolute; left:96px; bottom:84px; display:flex; gap:18px; }
.pill b { font-family:'JetBrains Mono',monospace; font-size:28px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; padding:20px 30px; border-radius:99px; border:2px solid #56634f; background:#0b0f0ce6; }
.pill b.on { background:#c6f27a; border-color:#c6f27a; color:#0c1408; }
.url { position:absolute; right:70px; bottom:92px; font-family:'JetBrains Mono',monospace; font-size:34px; font-weight:700; color:#c6f27a; text-shadow:0 2px 24px #000; }
.bar { position:absolute; left:0; bottom:0; width:100%; height:14px; background:#c6f27a; }
</style>
</head>
<body>
<div class="grid"></div>
<div class="persp">
  <img class="shot back" src="../services-assets/media/services/portfolio/tac-lobby.webp" alt="">
  <img class="shot front" src="../services-assets/media/services/portfolio/mw5-mechbay.webp" alt="">
</div>
<div class="blend"></div><div class="glow"></div>
<div class="brand"><img src="sloth-logo.png" alt="">strategic sloth <span>✳</span></div>
<div class="copy">
  <p class="eyebrow"><i></i>UI/UX design &amp; development</p>
  <h1>Show us<span>the build.</span></h1>
  <p class="sub">Interfaces, designed and built.</p>
</div>
<div class="pill"><b class="on">Games</b><b>Apps</b><b>Sites</b><b>Courses</b></div>
<div class="url">strategicsloth.com/services</div>
<div class="bar"></div>
</body>
</html>
